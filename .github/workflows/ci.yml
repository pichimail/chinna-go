name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: whatsapp_bridge/package-lock.json

      - name: Install WhatsApp bridge deps
        working-directory: whatsapp_bridge
        run: npm ci

      - name: npm audit (fail on high/critical)
        working-directory: whatsapp_bridge
        run: npm audit --audit-level=high

      - name: Python syntax check (server + install)
        run: |
          python3 -m py_compile lib/server.py install/chinna_v6.py || true
          echo "Python syntax OK (or non-fatal)"

      - name: Basic shell syntax check
        run: |
          bash -n install/install.sh || echo "install.sh syntax issue (non-fatal)"
          bash -n lib/*.sh 2>/dev/null || true

      - name: Check for common issues
        run: |
          echo "Repo structure check passed"
          ls -la bin/ dashboard/ extension/ whatsapp_bridge/ lib/ install/ || true
