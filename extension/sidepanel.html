<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinna Assistant</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<div id="app">
  <!-- Header -->
  <header class="hdr">
    <div class="hdr-l">
      <div class="logo">◆</div>
      <div class="hdr-title">Chinna</div>
    </div>
    <div class="hdr-r">
      <button class="ic-btn" id="menuBtn" title="Tools">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      </button>
    </div>
  </header>

  <!-- Tool tray (toggled by menu) -->
  <div class="tray" id="tray" hidden>
    <button class="tool" data-act="screenshot" title="Screenshot tab">
      <svg viewBox="0 0 24 24" class="ic"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.2"/></svg>
      <span>Shot</span>
    </button>
    <button class="tool" data-act="record" title="Record screen">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="6"/></svg>
      <span>Record</span>
    </button>
    <button class="tool" data-act="summarize" title="Summarize tab">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      <span>Summary</span>
    </button>
    <button class="tool" data-act="scrape" title="Scrape data">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 5h16v4H4zM4 11h16v8H4z"/><path d="M8 15h8"/></svg>
      <span>Scrape</span>
    </button>
    <button class="tool" data-act="clone" title="Clone page to single HTML">
      <svg viewBox="0 0 24 24" class="ic"><path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M9 21H5a2 2 0 0 1-2-2v-4M15 21h4a2 2 0 0 0 2-2v-4"/></svg>
      <span>Clone</span>
    </button>
    <button class="tool" data-act="links" title="Extract links">
      <svg viewBox="0 0 24 24" class="ic"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
      <span>Links</span>
    </button>
  </div>

  <!-- Tab context strip -->
  <div class="ctx" id="ctx">
    <span class="ctx-dot"></span>
    <span class="ctx-title" id="ctxTitle">Reading current tab…</span>
  </div>

  <!-- Suggestions (auto-switch per tab, max 3) -->
  <div class="suggs" id="suggs"></div>

  <!-- Messages -->
  <div class="msgs" id="msgs">
    <div class="welcome">
      <div class="welcome-icon">◆</div>
      <div class="welcome-title">Ask about this tab</div>
      <div class="welcome-sub">Summarize, scrape, clone, or just chat. I watch the page you're on.</div>
    </div>
  </div>

  <!-- Composer -->
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask anything about this page…"></textarea>
    <button class="send" id="sendBtn" title="Send">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 12l16-8-6 8 6 8z"/></svg>
    </button>
  </div>
</div>
<script src="sidepanel.js"></script>
</body>
</html>
