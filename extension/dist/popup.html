<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chinna Scanner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <div class="brand">
          <img src="icon.svg" alt="">
          <span>Chinna Live</span>
        </div>
        <h1>Scan. Diagnose. Fix.</h1>
      </div>
      <div class="health" id="health">
        <span class="dot"></span>
        <span id="healthText">Checking</span>
      </div>
    </section>

    <section class="toolbar">
      <button class="primary" id="scanBtn">
        <span class="icon">⌁</span>
        Scan Active Site
      </button>
      <label class="upload">
        <input id="fileInput" type="file" multiple>
        <span class="icon">↑</span>
        Upload Logs
      </label>
    </section>

    <section class="prompt">
      <textarea id="prompt" rows="3" placeholder="Ask Chinna what to check, for example: find React console errors and give exact terminal commands"></textarea>
      <button id="analyzeBtn">Send to Chinna</button>
    </section>

    <section class="scoreboard">
      <div class="score">
        <span id="scoreValue">--</span>
        <small>site score</small>
      </div>
      <div class="metric">
        <span id="issueCount">0</span>
        <small>findings</small>
      </div>
      <div class="metric">
        <span id="errorCount">0</span>
        <small>live errors</small>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Findings</h2>
        <button class="ghost" id="copyScanBtn">Copy Scan</button>
      </div>
      <div id="findings" class="stack empty">Run a scan to inspect the active page.</div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Commands</h2>
        <span class="fine">confirm before run</span>
      </div>
      <div id="commands" class="stack empty">Commands appear after scan or analysis.</div>
    </section>

    <section class="panel ai">
      <div class="panel-head">
        <h2>Chinna Answer</h2>
        <span id="model" class="fine">local</span>
      </div>
      <pre id="answer">No analysis yet.</pre>
    </section>

    <footer>
      <span>Console capture starts after injection.</span>
      <button class="ghost" id="openDashboard">Dashboard</button>
    </footer>
  </main>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
