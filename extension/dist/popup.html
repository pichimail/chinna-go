<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chinna</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icon.svg" alt="">
        <span>Chinna</span>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="copyScanBtn" title="Copy latest scan" aria-label="Copy latest scan">[]</button>
        <button class="icon-btn" id="openDashboard" title="Open dashboard" aria-label="Open dashboard">↗</button>
        <div class="health" id="health">
          <span class="dot"></span>
          <span id="healthText">Checking</span>
        </div>
      </div>
    </header>

    <section class="stage">
      <div class="hero-copy">
        <h1>Hello, pichi</h1>
        <p>How can I help you today?</p>
      </div>

      <div class="quick-actions" aria-label="Quick actions">
        <button data-quick="scan">Scan this tab</button>
        <button data-quick="errors">Find console errors</button>
        <button data-quick="commands">Give fix commands</button>
        <label for="fileInput">Upload logs</label>
      </div>

      <section class="status-grid" aria-label="Scan status">
        <div>
          <span id="scoreValue">--</span>
          <small>score</small>
        </div>
        <div>
          <span id="issueCount">0</span>
          <small>findings</small>
        </div>
        <div>
          <span id="errorCount">0</span>
          <small>errors</small>
        </div>
      </section>

      <section class="conversation" id="conversation" aria-live="polite">
        <article class="bubble assistant">
          <span class="label">Chinna</span>
          <p>Ready to scan the active page.</p>
        </article>
      </section>
    </section>

    <section class="composer" aria-label="Chinna prompt">
      <div class="sharebar">
        <span id="contextText">Sharing "Current tab"</span>
        <button id="clearBtn" title="Clear chat" aria-label="Clear chat">×</button>
      </div>
      <textarea id="prompt" rows="2" placeholder="Ask for a scan, fix prompt, terminal command, or uploaded log analysis"></textarea>
      <div class="composer-row">
        <label class="plus" for="fileInput" title="Upload files" aria-label="Upload files">+</label>
        <select id="modeSelect" title="Analysis mode" aria-label="Analysis mode">
          <option>Flash</option>
          <option>Local</option>
          <option>Fix</option>
        </select>
        <button class="secondary" id="scanBtn">Scan</button>
        <button class="send" id="analyzeBtn" title="Send" aria-label="Send">▶</button>
      </div>
      <input id="fileInput" type="file" multiple>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
