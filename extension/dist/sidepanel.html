<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chinna Side Panel</title>
  <link rel="stylesheet" href="popup.css" />
  <style>
    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #101012;
    }

    .shell {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body data-shell="sidepanel">
  <main class="shell">
    <header class="app-header">
      <div class="brand-wrap">
        <img src="icon.svg" alt="Chinna" class="brand-icon" />
        <div>
          <div class="eyebrow">Chinna assistant</div>
          <h1 id="greeting">Hey Buddy</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="modeToggleBtn" class="icon-btn" title="Attach to tab" data-tooltip="Attach to tab">⊞</button>
        <button id="sidePanelBtn" class="icon-btn" title="Side panel active" data-tooltip="Side panel active">⇢</button>
        <button id="attachBtn" class="icon-btn" title="Attach to tab" data-tooltip="Attach to tab">⊞</button>
        <button id="clearBtn" class="icon-btn" title="Clear chat" data-tooltip="Clear chat">⟲</button>
      </div>
    </header>

    <section class="hero">
      <p id="subGreeting">I’ll stay calm, clear, and tuned to this tab.</p>
      <div class="site-pills">
        <span class="pill" id="hostPill">Current site</span>
        <span class="pill" id="modePill">Side panel mode</span>
        <span class="pill" id="memoryPill">Smart prompts</span>
      </div>
    </section>

    <section class="workspace" id="workspace">
      <aside class="rail" id="rail">
        <section class="card soft">
          <div class="card-head">
            <span>Quick suggestions</span>
            <button id="pageBriefBtn" class="tiny-btn">Copy brief</button>
          </div>
          <div id="suggestions" class="suggestions"></div>
        </section>

        <section class="card soft">
          <div class="card-head">
            <span>Page pulse</span>
            <button id="scanBtn" class="tiny-btn">Scan</button>
          </div>
          <div class="stats">
            <div><strong id="scoreValue">--</strong><span>Score</span></div>
            <div><strong id="issueCount">0</strong><span>Findings</span></div>
            <div><strong id="errorCount">0</strong><span>Errors</span></div>
            <div><strong id="nodeCount">--</strong><span>Nodes</span></div>
          </div>
          <p id="siteBrief" class="site-brief">Open a page and I’ll shape the suggestions around it.</p>
        </section>

        <section class="card soft compact">
          <div class="card-head">
            <span>Modes</span>
          </div>
          <div class="mode-actions">
            <button id="overlayModeBtn" class="ghost-btn">Attach in tab</button>
            <button id="panelModeBtn" class="ghost-btn">Refresh panel</button>
          </div>
        </section>
      </aside>

      <div class="splitter" id="splitter" aria-hidden="true"></div>

      <section class="chat-surface">
        <div id="conversation" class="conversation"></div>
        <div id="thinking" class="thinking" hidden>
          <span class="thinking-dot"></span>
          <span id="thinkingText">Thinking...</span>
        </div>
        <form id="composer" class="composer">
          <label for="fileInput" class="icon-btn upload-btn" title="Add files" data-tooltip="Add files">+</label>
          <textarea id="prompt" placeholder="Ask naturally about this page..."></textarea>
          <div class="composer-actions">
            <select id="styleSelect" title="Response style">
              <option value="gentle">Gentle</option>
              <option value="focused">Focused</option>
              <option value="actionable">Actionable</option>
            </select>
            <button type="button" id="copyScanBtn" class="ghost-btn">Copy scan</button>
            <button type="submit" id="analyzeBtn" class="send-btn">Send</button>
          </div>
        </form>
      </section>
    </section>
  </main>

  <input id="fileInput" type="file" multiple hidden />
  <div id="toast" class="toast"></div>
  <script src="popup.js"></script>
</body>
</html>
