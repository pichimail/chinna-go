<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Chinna v7.0</title>
<link rel="icon" href="assets/chinna-favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#080808;--s0:#0a0a0a;--s1:#121214;--s2:#1a1a1d;--line:#1c1c1f;--line2:#262629;--line3:#333337;--t1:#fff;--t2:#adadad;--t3:#a1a1a1;--t4:rgba(255,255,255,.3);--acc:#baff29;--acc-bg:rgba(186,255,41,.08);--acc-bd:rgba(186,255,41,.25);--violet:#bf5af2;--pink:#ff375f;--yellow:#ffd60a;--blue:#0a84ff;--green:#30d158;--orange:#ff9500;--cyan:#50b1c9;--red:#ff453a;--wa:#25d366;--font:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;--mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}::selection{background:rgba(186,255,41,.28)}::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--line3)}.app{height:100%;display:flex;flex-direction:column;background:#080808}.top{height:56px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(8,8,8,.98);z-index:10}.brand{height:56px;width:188px;display:flex;align-items:center;gap:10px;padding:0 16px;border-right:1px solid var(--line)}.hamb,.tool{border:0;background:transparent;color:var(--t3)}.logo{width:28px;height:28px;border-radius:4px;background:var(--acc);color:#030a00;display:grid;place-items:center;font-weight:950}.word{font-size:12px;font-weight:900;letter-spacing:2px}.ver{font-size:9px;color:var(--acc);font-weight:900}.nav{height:56px;display:flex;align-items:end;gap:22px;padding:0 24px;flex:1;overflow:auto}.nav button{height:56px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);padding-top:2px;white-space:nowrap}.nav button.on{color:#fff;border-bottom-color:var(--acc);font-weight:800}.right{height:56px;display:flex;align-items:center;border-left:1px solid var(--line);gap:10px;padding:0 14px}.search{height:34px;width:220px;border:1px solid var(--line2);background:transparent;border-radius:2px;padding:0 12px;color:var(--t2);outline:0}.main{flex:1;min-height:0;display:flex}.side{width:58px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 8px;gap:8px;background:#080808}.side.open{width:220px;align-items:stretch}.side button{height:38px;border:1px solid transparent;background:transparent;color:var(--t3);border-radius:2px;display:flex;align-items:center;gap:10px;padding:0 11px}.side button:hover,.side button.on{border-color:var(--line2);background:rgba(255,255,255,.05);color:#fff}.side .lab{display:none}.side.open .lab{display:inline}.content{flex:1;min-width:0;overflow:hidden}.view{height:100%;display:none;flex-direction:column;overflow:hidden;background:#080808}.view.on{display:flex}.vhead{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px}.vhead h2{font-size:15px}.vhead .sub{color:var(--t3);font-size:12px}.vbody{flex:1;min-height:0;overflow:auto;padding:16px}.grid{display:grid;gap:8px}.cols{grid-template-columns:repeat(12,1fr)}.card{border:1px solid var(--line2);background:transparent;border-radius:2px;padding:14px;min-height:80px}.card:hover{border-color:rgba(255,255,255,.25)}.kicker{font:900 10px/1 var(--mono);letter-spacing:3px;text-transform:uppercase;color:var(--acc);margin-bottom:10px}.muted{color:var(--t3)}.mono{font-family:var(--mono)}.btn{height:34px;border:1px solid var(--line2);background:transparent;color:var(--t2);border-radius:2px;padding:0 12px}.btn:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05);color:#fff}.btn.primary{background:var(--acc);border-color:var(--acc);color:#030a00;font-weight:900}.btn.danger{border-color:rgba(255,69,58,.3);color:var(--red)}.field{height:36px;border:1px solid var(--line2);border-radius:2px;background:transparent;color:#fff;padding:0 12px;outline:0}.field:focus,textarea:focus{border-color:rgba(186,255,41,.45);box-shadow:0 0 0 1px rgba(186,255,41,.2),0 0 24px rgba(186,255,41,.1)}.chip{height:32px;border:1px solid var(--line2);background:transparent;color:var(--t2);border-radius:999px;padding:0 12px}.chip.on{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}.stat{border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent);padding:12px;border-radius:2px}.stat b{font-size:34px;color:var(--c);text-shadow:0 0 16px color-mix(in srgb,var(--c) 60%,transparent)}.sparks{width:100%;height:38px}.hero{position:relative;min-height:100%;display:grid;place-items:center;overflow:hidden}.blob{position:absolute;border-radius:999px;filter:blur(62px);opacity:.18}.b1{width:430px;height:230px;background:var(--acc);left:24%;top:26%}.b2{width:360px;height:250px;background:var(--violet);right:16%;top:34%}.b3{width:330px;height:170px;background:var(--blue);right:30%;top:40%}.heroCore{width:min(840px,92vw);text-align:center;position:relative;z-index:2;margin-top:-40px}.studioLogo{display:inline-flex;gap:12px;align-items:center;color:var(--t4);font:900 12px var(--mono);letter-spacing:4px;margin-bottom:22px}.studioLogo i{width:34px;height:34px;border-radius:7px;background:var(--acc);color:#030a00;display:grid;place-items:center;font-style:normal;box-shadow:0 0 32px rgba(186,255,41,.35)}.hero h1{font-size:clamp(42px,5.8vw,72px);line-height:.9;letter-spacing:-4px}.grad{background:linear-gradient(90deg,#baff29,#83f37d,#50b1c9);-webkit-background-clip:text;background-clip:text;color:transparent}.composer{margin-top:28px;border:1px solid var(--line2);border-radius:12px;background:rgba(8,8,8,.72);backdrop-filter:blur(16px);text-align:left}.composer textarea{width:100%;height:108px;border:0;background:transparent;outline:0;color:#fff;padding:22px 24px;font-size:17px;resize:none}.bar{height:56px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}.model{height:32px;border:1px solid var(--acc-bd);background:rgba(186,255,41,.04);color:var(--acc);border-radius:999px;padding:0 14px;font:900 13px var(--mono);display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;background:var(--acc);border-radius:999px;box-shadow:0 0 14px var(--acc)}.send{width:36px;height:36px;border:1px solid var(--line2);background:transparent;border-radius:2px}.send.ready{background:var(--acc);color:#030a00;border-color:var(--acc)}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:28px}.studioChat,.studioBuild{height:100%;display:none}.studioChat.on{display:flex;justify-content:center}.threadShell{width:min(980px,94vw);height:100%;position:relative}.thread{height:100%;overflow:auto;padding:72px 0 170px}.msg{display:flex;flex-direction:column;margin:0 0 26px;max-width:680px}.msg.user{margin-left:auto;align-items:flex-end}.meta{font:900 11px var(--mono);letter-spacing:1px;color:var(--t3);margin-bottom:7px}.msg.user .meta{color:var(--acc)}.bubble{border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:15px 18px;white-space:pre-wrap;line-height:1.55}.msg.user .bubble{border-color:rgba(186,255,41,.55);box-shadow:inset 0 0 18px rgba(186,255,41,.08)}.bottom{position:absolute;left:0;right:0;bottom:0;padding:42px 0 18px;background:linear-gradient(to top,#080808 70%,transparent)}.split{height:100%;display:flex}.leftPane{width:440px;min-width:280px;max-width:680px;border-right:1px solid var(--line);position:relative}.resize{width:3px;cursor:col-resize}.resize:hover{background:var(--acc)}.artifact{flex:1;min-width:0;display:flex;flex-direction:column}.tabs{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:22px;padding:0 18px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);padding-bottom:13px}.tab.on{color:#fff;border-bottom-color:var(--acc)}.pane{flex:1;min-height:0;display:none;overflow:auto}.pane.on{display:block}.preview iframe{width:100%;height:100%;border:0;background:#080808}.code,.term{font:14px/1.65 var(--mono);padding:24px;white-space:pre-wrap}.term{color:#2edd5e}.table{width:100%;border-collapse:collapse}.table tr{border-bottom:1px solid var(--line)}.table td,.table th{padding:10px;text-align:left}.table tr:hover{background:rgba(255,255,255,.03)}.waWrap{height:100%;display:grid;grid-template-columns:310px 1fr;border:1px solid var(--line);min-height:0}.contacts{border-right:1px solid var(--line);overflow:auto}.contact{display:flex;gap:10px;padding:12px;border-left:2px solid transparent;cursor:pointer}.contact.on{border-left-color:var(--wa);background:rgba(37,211,102,.08)}.chatArea{display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:18px}.waMsg{max-width:68%;border:1px solid var(--line2);border-radius:12px 12px 12px 2px;padding:10px 12px;margin-bottom:10px}.waMsg.me{margin-left:auto;border-color:rgba(37,211,102,.32);background:rgba(37,211,102,.10);border-radius:12px 12px 2px 12px}.toast{position:fixed;right:18px;bottom:18px;z-index:99;border:1px solid var(--line2);background:#080808;color:#fff;padding:12px 14px;border-radius:2px;display:none}.toast.on{display:block}@media(max-width:900px){.brand{width:auto}.search,.right .tool,.side{display:none}.nav{gap:16px;padding:0 12px}.cols{grid-template-columns:1fr}.card{grid-column:auto!important}.waWrap{grid-template-columns:1fr}.contacts{display:none}.split{display:block}.leftPane{width:100%!important;height:48%;border-right:0;border-bottom:1px solid var(--line)}.artifact{height:52%}.hero h1{letter-spacing:-2px}.bar .muted{display:none}}
</style>
</head>
<body><div class="app"></div><div class="toast"></div>
<script>
(function(){
const qs=(s,r=document)=>r.querySelector(s), qsa=(s,r=document)=>[...r.querySelectorAll(s)];
const api=async(u,o={})=>{try{let r=await fetch(u,o);let t=await r.text();try{return JSON.parse(t)}catch{return {text:t,ok:r.ok}}}catch(e){return {error:e.message}}};
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt=n=>n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':n>1e3?(n/1e3).toFixed(1)+' KB':(n||0)+' B';
const toast=m=>{let t=qs('.toast');t.textContent=m;t.classList.add('on');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),2600)};
const state={view:localStorage.chinnaView||'overview',theme:localStorage.chinnaTheme||'dark',model:'openrouter/free',history:[],artifact:null,files:[],apps:[],plugins:[],dupes:[],settings:{},wa:1};
document.documentElement.dataset.theme=state.theme;
const NAV=[['overview','Overview','⌁'],['studio','Studio','◆'],['files','Files','▣'],['apps','Apps','▤'],['plugins','Plugins','✦'],['duplicates','Duplicates','◇'],['whatsapp','WhatsApp','●'],['secure','Secure','◉'],['webviews','Web Views','◎'],['mac','Mac','⌘'],['projects','Projects','⌂'],['connect','Connect','⇄'],['settings','Settings','⚙'],['changelog','Changelog','△']];
function mount(){
 qs('.app').innerHTML=`<header class="top"><div class="brand"><button class="hamb">☰</button><div class="logo">C</div><div class="word">CHINNA</div><div class="ver">v7</div></div><nav class="nav">${NAV.slice(0,7).map(n=>`<button data-go="${n[0]}">${n[1]}</button>`).join('')}</nav><div class="right"><button class="tool" data-act="theme">☀</button><input class="search" placeholder="⌘K Search..."><button class="tool" data-act="refresh">↻</button><button class="tool" data-go="settings">?</button></div></header><div class="main"><aside class="side">${NAV.map(n=>`<button data-go="${n[0]}"><span>${n[2]}</span><span class="lab">${n[1]}</span></button>`).join('')}</aside><section class="content">${NAV.map(n=>`<div class="view" data-view="${n[0]}"></div>`).join('')}</section></div>`;
 qsa('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 qs('.hamb').onclick=()=>qs('.side').classList.toggle('open');
 qs('[data-act=theme]').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';localStorage.chinnaTheme=state.theme;document.documentElement.dataset.theme=state.theme;toast('Theme changed')};
 qs('[data-act=refresh]').onclick=()=>render(state.view,true);
 render(state.view);
}
function go(v){state.view=v;localStorage.chinnaView=v;render(v)}
function header(v,title,sub=''){return `<div class="vhead"><h2>${title}</h2><span class="sub">${sub}</span><span style="flex:1"></span><button class="btn" data-refresh="${v}">Refresh</button></div>`}
function activate(v){qsa('[data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===v));qsa('.view').forEach(x=>x.classList.toggle('on',x.dataset.view===v));}
function render(v,force=false){activate(v);let el=qs(`[data-view="${v}"]`);({overview,studio,files,apps,plugins,duplicates,whatsapp,secure,webviews,mac,projects,connect,settings,changelog}[v]||overview)(el,force);qsa('[data-refresh]').forEach(b=>b.onclick=()=>render(b.dataset.refresh,true))}
async function overview(el,force){el.innerHTML=header('overview','damarakam mission control','Live local telemetry, shortcuts, AI readiness, update status')+`<div class="vbody"><div class="grid cols"><div class="card" style="grid-column:span 8"><div class="kicker">CHINNA MISSION CONTROL</div><h1>damarakam mission control</h1><p class="muted">Live local telemetry, shortcuts, AI readiness, and update status — all from one futuristic command surface.</p><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><span class="chip on">● up</span><span class="chip mono">loading ip</span><span class="chip mono">M1 Pro</span><span class="chip mono">macOS</span></div></div><div class="card" style="grid-column:span 4"><div class="kicker">MAC VITALS</div><div class="grid" style="grid-template-columns:1fr 1fr">${['CPU','RAM','DISK','BATTERY'].map((x,i)=>`<div class="stat ${x.toLowerCase()}" style="--c:${['var(--acc)','var(--blue)','var(--red)','var(--green)'][i]}"><small>${x}</small><br><b data-stat="${x.toLowerCase()}">--</b><svg class="sparks"></svg></div>`).join('')}</div></div><div class="card" style="grid-column:span 4"><div class="kicker">OPEN WEATHER</div><div style="font-size:46px;font-weight:950">29°</div><b style="color:var(--blue)">Partly Cloudy</b><p class="muted">Hyderabad · feels like 32°</p></div><div class="card" style="grid-column:span 4"><div class="kicker">SHORTCUTS</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[['Studio','studio'],['Files','files'],['Apps','apps'],['Plugins','plugins'],['Duplicates','duplicates'],['Settings','settings']].map(x=>`<button class="btn" data-go="${x[1]}">${x[0]}</button>`).join('')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px"><button class="btn danger" data-action="purge">Purge RAM</button><button class="btn" data-action="clean">Deep Clean</button><button class="btn" data-go="plugins">Scan</button><button class="btn" data-go="settings">Battery</button></div></div><div class="card" style="grid-column:span 4"><div class="kicker">AI READINESS</div><div class="muted" data-ai-status>Checking...</div><button class="btn primary" data-go="studio" style="margin-top:12px">Open Studio</button></div><div class="card" style="grid-column:span 6"><div class="kicker">QUICK AI</div><div class="composer" style="margin-top:0"><textarea placeholder="Ask Chinna..."></textarea><div class="bar"><span class="muted">chat · code · Mac control</span><span style="flex:1"></span><button class="send">↑</button></div></div></div><div class="card" style="grid-column:span 6"><div class="kicker">QUICK TERMINAL</div><pre class="term" data-overview-term>root@damarakam:~ chinna v7.0.0\nchecking backend...</pre></div></div></div>`;
 qsa('[data-go]',el).forEach(b=>b.onclick=()=>go(b.dataset.go)); qsa('[data-action]',el).forEach(b=>b.onclick=()=>{toast('Running '+b.dataset.action);post('/api/job',{type:b.dataset.action}).then(()=>toast('Action sent'))});
 let s=await first(['/api/status','/api/stats','/api/system']); let ai=await api('/api/ai/status'); qs('[data-ai-status]',el).textContent=ai.label||ai.status||s.ai||'OpenRouter / local status available in Settings';
 let cpu=s.cpu?.pct||s.cpu||27, ram=s.memory?.pct||s.ram||88, disk=s.disk?.pct||s.disk||91, bat=s.battery?.pct||s.battery||97; [['cpu',cpu],['ram',ram],['disk',disk],['battery',bat]].forEach(x=>{let n=qs(`[data-stat="${x[0]}"]`,el); if(n)n.textContent=Math.round(x[1])+'%'});
 qs('[data-overview-term]',el).textContent=`root@damarakam:~ chinna v7.0.0\n✓ backend online\n✓ CPU ${cpu}% · RAM ${ram}% · Disk ${disk}%\n✓ model ${ai.model||ai.active||state.model}`;
 qs('.composer .send',el).onclick=()=>{let v=qs('.composer textarea',el).value;go('studio');setTimeout(()=>studioSend(v),60)}
}
async function first(list){for(let u of list){let d=await api(u);if(!d.error)return d}return {}}
function composerHTML(ph='Ask Chinna — chat · build · run · explain...'){return `<div class="composer"><textarea placeholder="${ph}"></textarea><div class="bar"><button class="model"><span class="dot"></span><span>${state.model.includes('free')?'chinna/free':'chinna/auto'}</span></button><button class="btn" data-plus>+</button><span style="flex:1"></span><span class="muted mono">enter send</span><button class="send">↑</button></div></div>`}
function studio(el){el.innerHTML=`<div class="hero studioHero"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="heroCore"><div class="studioLogo"><i>C</i><span>CHINNA STUDIO</span></div><h1>What are we<br><span class="grad">building today?</span></h1><p class="muted" style="margin-top:16px">Chat · Code · Agent · Mac control — all in one.</p>${composerHTML()}<div class="chips">${['Build a landing page','Fix TypeScript errors','Run Mac Doctor','Write a Python script','Explain this codebase','Clone a GitHub repo','Generate a UI component','Debug React app'].map(x=>`<button class="chip">${x}</button>`).join('')}</div></div></div><div class="studioChat"><div class="threadShell"><div class="thread chatThread"></div><div class="bottom"><button class="btn" data-new>← New chat</button>${composerHTML('Ask Chinna — chat...')}</div></div></div><div class="studioBuild"><div class="split"><aside class="leftPane"><div class="thread buildThread"></div><div class="bottom"><button class="btn" data-new>← New chat</button>${composerHTML('Ask Chinna — build...')}</div></aside><div class="resize"></div><section class="artifact"><div class="tabs"><button class="tab on" data-tab="preview">Preview</button><button class="tab" data-tab="code">Code</button><button class="tab" data-tab="terminal">Terminal</button><span class="muted mono fileLabel" style="margin-left:auto">artifact.html</span><button class="btn primary exportBtn">Export</button></div><div class="pane preview on"><div class="card" style="height:100%;display:grid;place-items:center">Preview appears after a build.</div></div><pre class="pane code"></pre><pre class="pane term">$ chinna studio\n✓ ready</pre></section></div></div>`;
 bindStudio(el);
}
function bindStudio(el){qsa('.composer textarea',el).forEach(ta=>{ta.oninput=()=>qs('.send',ta.closest('.composer')).classList.toggle('ready',!!ta.value.trim());ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();studioSend(ta.value);ta.value=''}}});qsa('.send',el).forEach(b=>b.onclick=()=>{let ta=qs('textarea',b.closest('.composer'));studioSend(ta.value);ta.value=''});qsa('.chip',el).forEach(b=>b.onclick=()=>studioSend(b.textContent));qsa('[data-new]',el).forEach(b=>b.onclick=()=>{state.history=[];go('studio')});qsa('[data-tab]',el).forEach(b=>b.onclick=()=>tab(el,b.dataset.tab));qs('.exportBtn',el).onclick=()=>post('/api/agent/export',{ids:state.artifact?[state.artifact.id]:[],zip:true,to_disk:true}).then(j=>{toast(j.message||'Export complete');if(j.zip_download)location.href=j.zip_download});let res=qs('.resize',el),left=qs('.leftPane',el);res.onmousedown=e=>{e.preventDefault();document.onmousemove=m=>{left.style.width=Math.max(280,Math.min(680,m.clientX-58))+'px'};document.onmouseup=()=>{document.onmousemove=null}}}
function msg(th,who,text){let d=document.createElement('div');d.className='msg '+(who==='YOU'?'user':'ai');d.innerHTML=`<div class="meta">${who} · ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}${who==='CHINNA'?' ✓':''}</div><div class="bubble">${esc(text)}</div>`;th.appendChild(d);d.scrollIntoView({block:'end'});return d}
function needsBuild(s){return /build|create|generate|make|write|code|html|component|landing|page|app|fix|debug|refactor|script|clone|repo|run|terminal/i.test(s)}
async function studioSend(text){text=(text||'').trim();if(!text)return;let el=qs('[data-view="studio"]');if(!el.classList.contains('on'))go('studio');el=qs('[data-view="studio"]');if(needsBuild(text)){qs('.studioHero',el).style.display='none';qs('.studioBuild',el).classList.add('on');let th=qs('.buildThread',el);msg(th,'YOU',text);let a=msg(th,'CHINNA','Building that now...');let term=qs('.term',el);term.textContent=`$ chinna build ${text}\nconnecting to /api/agent...\n`;try{let r=await fetch('/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:'build',model:state.model,history:state.history})});let reader=r.body?.getReader();if(reader){let dec=new TextDecoder(),buf='';while(true){let x=await reader.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let parts=buf.split('\n\n');buf=parts.pop();for(let p of parts){let line=p.split('\n').find(y=>y.startsWith('data:'));if(line)handleAgent(JSON.parse(line.slice(5)),a,el)}}}else term.textContent+=await r.text();await loadLatest(el)}catch(e){a.querySelector('.bubble').textContent='Agent error: '+e.message;term.textContent+='error: '+e.message}}else{qs('.studioHero',el).style.display='none';qs('.studioChat',el).classList.add('on');let th=qs('.chatThread',el);msg(th,'YOU',text);let a=msg(th,'CHINNA','Thinking...');let j=await post('/api/chat',{message:text,model:state.model,history:state.history});a.querySelector('.bubble').textContent=j.reply||j.error||'No response';state.history=j.history||state.history}}
function handleAgent(ev,a,el){if(ev.type==='text'){let b=a.querySelector('.bubble');b.textContent=(b.textContent==='Building that now...'?'':b.textContent+'\n')+ev.content}if(ev.type==='tool_start')qs('.term',el).textContent+=`\n$ ${ev.tool} running`;if(ev.type==='tool_result')qs('.term',el).textContent+=`\n✓ ${ev.tool} complete\n${String(ev.result||'').slice(0,800)}`;if(ev.type==='artifact'){state.artifact=ev.meta;loadArtifact(el,ev.meta.id)}if(ev.type==='done'&&ev.artifacts?.length){state.artifact=ev.artifacts.at(-1);loadArtifact(el,state.artifact.id)}}
async function loadLatest(el){let j=await api('/api/artifacts');let a=(j.artifacts||[]).at(-1);if(a)loadArtifact(el,a.id)}
async function loadArtifact(el,id){let j=await api('/api/artifact/'+id);state.artifact=j;qs('.fileLabel',el).textContent=j.name||j.file||'artifact';qs('.code',el).textContent=j.content||'';qs('.preview',el).innerHTML=j.preview!==false?`<iframe sandbox="allow-scripts allow-same-origin allow-forms" src="/api/artifact/${id}/preview"></iframe>`:'<div class="card">Source-only artifact. Open Code tab.</div>'}
function tab(el,name){qsa('.tab',el).forEach(b=>b.classList.toggle('on',b.dataset.tab===name));qsa('.pane',el).forEach(p=>p.classList.remove('on'));qs(name==='preview'?'.preview':name==='code'?'.code':'.term',el).classList.add('on')}
async function files(el,force){el.innerHTML=header('files','Files','Large files · downloads · all files')+`<div class="toolbar vhead"><button class="chip on" data-filetab="large">Large Files</button><button class="chip" data-filetab="downloads">Downloads</button><button class="chip" data-filetab="all">All Files</button><input class="field fileSearch" placeholder="Filter files"><button class="btn sortSize">Size ↓</button><button class="btn sortName">Name</button><button class="btn bulkTrash danger">Trash selected</button></div><div class="vbody"><div class="muted fileStats">Loading files...</div><table class="table"><tbody class="fileRows"></tbody></table></div>`;let data=await first(['/api/files','/api/storage?path=~','/api/storage']);state.files=(data.files||data.items||data.large||[]).map((f,i)=>({id:i,...f,size_bytes:f.size_bytes||f.bytes||0}));bindFiles(el)}
function bindFiles(el){let sort='size';function draw(){let q=qs('.fileSearch',el).value.toLowerCase();let arr=state.files.filter(f=>(f.name||f.path||'').toLowerCase().includes(q));arr.sort((a,b)=>sort==='name'?String(a.name).localeCompare(String(b.name)):(b.size_bytes||0)-(a.size_bytes||0));qs('.fileStats',el).textContent=`${arr.length} files · ${fmt(arr.reduce((s,f)=>s+(f.size_bytes||0),0))}`;qs('.fileRows',el).innerHTML=arr.map(f=>`<tr><td><input type="checkbox" data-path="${esc(f.path)}"></td><td>▣</td><td><b>${esc(f.name||f.path)}</b><div class="muted mono">${esc(f.path||'')}</div></td><td><span class="chip">${esc(f.kind||f.type||'File')}</span></td><td class="mono">${f.size||fmt(f.size_bytes)}</td><td><button class="btn" data-reveal="${esc(f.path)}">Reveal</button> <button class="btn danger" data-trash="${esc(f.path)}">Trash</button></td></tr>`).join('')||'<tr><td class="muted">No files returned by backend.</td></tr>';qsa('[data-reveal]',el).forEach(b=>b.onclick=()=>post('/api/file/reveal',{path:b.dataset.reveal}).then(()=>toast('Reveal requested')));qsa('[data-trash]',el).forEach(b=>b.onclick=()=>post('/api/file/trash',{path:b.dataset.trash}).then(()=>toast('Trash requested')))}qs('.fileSearch',el).oninput=draw;qs('.sortSize',el).onclick=()=>{sort='size';draw()};qs('.sortName',el).onclick=()=>{sort='name';draw()};qs('.bulkTrash',el).onclick=()=>toast('Select rows then confirm trash from file actions');draw()}
async function apps(el){el.innerHTML=header('apps','Apps','Application manager')+`<div class="vbody"><div class="grid cols appsGrid"></div></div>`;let d=await first(['/api/apps','/api/applications']);let apps=d.apps||d.items||[];if(!apps.length)apps=['Xcode','Docker','Chrome','VS Code','Figma','Slack','iTerm2','Claude'].map((n,i)=>({name:n,size_bytes:(i+1)*2e8,category:i<4?'Developer':'Utility'}));qs('.appsGrid',el).innerHTML=apps.map(a=>`<div class="card" style="grid-column:span 3"><div class="kicker">${esc(a.category||'APP')}</div><h3>${esc(a.name)}</h3><p class="muted">${esc(a.version||a.developer||'Installed application')}</p><p class="mono muted">${fmt(a.size_bytes||0)}</p><button class="btn" data-open="${esc(a.path||a.name)}">Open</button> <button class="btn danger" data-uninstall="${esc(a.path||a.name)}">Uninstall</button></div>`).join('');qsa('[data-open]',el).forEach(b=>b.onclick=()=>post('/api/app/open',{path:b.dataset.open}).then(()=>toast('Open requested')));qsa('[data-uninstall]',el).forEach(b=>b.onclick=()=>confirm('Uninstall?')&&post('/api/app/uninstall',{path:b.dataset.uninstall}).then(()=>toast('Uninstall requested')))}
async function plugins(el){el.innerHTML=header('plugins','Plugins','Built-in action modules')+`<div class="vbody"><div class="grid cols plugGrid"></div></div>`;let d=await api('/api/plugins');let p=d.plugins||[];qs('.plugGrid',el).innerHTML=(p.length?p:[]).map(x=>`<div class="card" style="grid-column:span 4"><div class="kicker">${esc(x.category||'PLUGIN')}</div><h3>${esc(x.icon||'✦')} ${esc(x.name||x.id)}</h3><p class="muted">${esc(x.description||'Chinna plugin')}</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${(x.actions||[]).slice(0,4).map(a=>`<button class="btn" data-plugin="${esc(x.id)}" data-action="${esc(a.id||a.name)}">${esc(a.label||a.name||a.id)}</button>`).join('')||'<span class="muted">No actions returned.</span>'}</div></div>`).join('')||'<div class="card">No plugins returned by backend.</div>';qsa('[data-plugin]',el).forEach(b=>b.onclick=()=>post('/api/plugin/run',{id:b.dataset.plugin,action:b.dataset.action}).then(j=>toast(j.error||'Plugin action finished')))}
async function duplicates(el){el.innerHTML=header('duplicates','Duplicates','Duplicate file groups')+`<div class="vbody"><div class="dupList muted">Scanning duplicates...</div></div>`;let d=await first(['/api/duplicates','/api/dupes']);let arr=d.groups||d.duplicates||[];qs('.dupList',el).innerHTML=arr.length?arr.map(g=>`<details class="card" open><summary><b>${esc(g.name||g.hash)}</b> · ${g.count||g.files?.length||0} copies · ${g.size||fmt(g.size_bytes||0)}</summary>${(g.files||[]).map(f=>`<div class="row"><span class="mono">${esc(f.path||f)}</span><span style="flex:1"></span><button class="btn danger">Trash</button></div>`).join('')}</details>`).join(''):'<div class="card">No duplicate groups returned yet.</div>'}
function whatsapp(el){let contacts=['Chinna AI','Raavi','Design Team','damarakam','Agent-001','GitHub Bot','System'];el.innerHTML=header('whatsapp','WhatsApp','Messages and AI control')+`<div class="vbody"><div class="waWrap"><div class="contacts">${contacts.map((c,i)=>`<div class="contact ${i+1===state.wa?'on':''}" data-wa="${i+1}"><div class="logo" style="background:${i?'#111':'var(--wa)'}">${c[0]}</div><div><b>${c}</b><div class="muted">Ready to help...</div></div></div>`).join('')}</div><div class="chatArea"><div class="vhead"><b>${contacts[state.wa-1]}</b><span class="sub">online</span></div><div class="messages"><div class="waMsg">Hey. What are you building today?</div><div class="waMsg me">Wire the dashboard to Python backend.</div></div><div class="vhead"><input class="field waInput" placeholder="Type a message"><button class="btn primary waSend">Send</button></div></div></div></div>`;qsa('[data-wa]',el).forEach(b=>b.onclick=()=>{state.wa=+b.dataset.wa;whatsapp(el)});qs('.waSend',el).onclick=()=>{let v=qs('.waInput',el).value;if(!v)return;let d=document.createElement('div');d.className='waMsg me';d.textContent=v;qs('.messages',el).appendChild(d);qs('.waInput',el).value='';post('/api/whatsapp/send',{to:contacts[state.wa-1],message:v}).then(()=>toast('Message sent / queued'))}}
function simplePage(el,id,title,sub,body){el.innerHTML=header(id,title,sub)+`<div class="vbody">${body}</div>`}
async function secure(el){simplePage(el,'secure','Secure Chat','Encrypted local AI chat',`<div class="card"><div class="kicker">E2E ENCRYPTED</div>${composerHTML('Ask secure Chinna...')}</div>`)}
function webviews(el){let items=JSON.parse(localStorage.embeds||'[]');if(!items.length)items=[{name:'GitHub',url:'https://github.com/trending'},{name:'Wikipedia',url:'https://wikipedia.org'}];simplePage(el,'webviews','Web Views','Embeds and saved sites',`<div class="grid cols">${items.map(x=>`<div class="card" style="grid-column:span 4"><h3>${esc(x.name)}</h3><p class="muted">${esc(x.url)}</p><button class="btn" onclick="window.open('${esc(x.url)}','_blank')">Open</button></div>`).join('')}</div>`)}
async function mac(el){let s=await first(['/api/status','/api/stats','/api/system']);simplePage(el,'mac','Mac','Activity monitor and hardware',`<div class="grid cols">${['cpu','memory','disk','battery','network','os'].map(k=>`<div class="card" style="grid-column:span 4"><div class="kicker">${k}</div><pre class="mono muted">${esc(JSON.stringify(s[k]||s[k==='memory'?'ram':'']||{},null,2))}</pre></div>`).join('')}</div>`)}
async function projects(el){let d=await api('/api/projects');let p=d.projects||[];simplePage(el,'projects','Projects','Local folder registry',`<div class="grid cols">${p.map(x=>`<div class="card" style="grid-column:span 4"><h3>${esc(x.short_path||x.path)}</h3><p class="muted">${esc(x.stack||'project')} · ${esc(x.status||'')}</p><button class="btn" data-open-project="${esc(x.path)}">Reveal</button></div>`).join('')||'<div class="card">No tracked projects yet.</div>'}</div>`);qsa('[data-open-project]',el).forEach(b=>b.onclick=()=>post('/api/project/open-folder',{path:b.dataset.openProject}))}
function connect(el){simplePage(el,'connect','Connect','Network, Bluetooth, services',`<div class="grid cols">${['OpenRouter API','GitHub Sync','Secure Relay','Telegram Bot','WhatsApp Bridge','Browser Extension'].map((x,i)=>`<div class="card" style="grid-column:span 4"><div class="kicker">${i%2?'STANDBY':'CONNECTED'}</div><h3>${x}</h3><button class="btn">Check</button></div>`).join('')}</div>`)}
async function settings(el){el.innerHTML=header('settings','Settings','API keys, models, interface, embeds')+`<div class="vbody"><div class="grid cols"><div class="card" style="grid-column:span 4"><div class="kicker">API KEYS</div><label>OpenRouter</label><input class="field" data-key="OPENROUTER_API_KEY" type="password" placeholder="sk-or..."><label>OpenAI</label><input class="field" data-key="OPENAI_API_KEY" type="password"><label>Anthropic</label><input class="field" data-key="ANTHROPIC_API_KEY" type="password"><button class="btn primary saveKeys">Save Keys</button></div><div class="card" style="grid-column:span 4"><div class="kicker">ACTIVE MODEL</div><div class="modelList"></div><button class="btn addModel">+ Model</button></div><div class="card" style="grid-column:span 4"><div class="kicker">DESKTOP APP</div><button class="btn primary" data-run="update">Check updates</button><button class="btn" data-run="doctor">Run Doctor</button><button class="btn" data-run="logs">View Logs</button></div></div></div>`;let m=await api('/api/models');let presets=m.presets||{free:'openrouter/free',auto:'openrouter/auto'};qs('.modelList',el).innerHTML=Object.entries(presets).map(([k,v])=>`<button class="btn ${v===(m.active||state.model)?'primary':''}" data-model="${esc(v)}" style="margin:4px">${esc(k)} · ${esc(v)}</button>`).join('');qsa('[data-model]',el).forEach(b=>b.onclick=()=>{state.model=b.dataset.model;post('/api/model/set',{model:state.model}).then(()=>toast('Model selected'))});qs('.saveKeys',el).onclick=()=>{let keys={};qsa('[data-key]',el).forEach(i=>{if(i.value)keys[i.dataset.key]=i.value});post('/api/keys',keys).then(j=>toast(j.error||'Keys saved'))};qsa('[data-run]',el).forEach(b=>b.onclick=()=>post('/api/job',{type:b.dataset.run}).then(()=>toast('Requested '+b.dataset.run)))}
async function changelog(el){let d=await api('/api/version-log');let arr=d.versions||d.history||[];simplePage(el,'changelog','Changelog','Release history and updates',`<div class="grid">${arr.map(x=>`<div class="card"><div class="kicker">${esc(x.version||'VERSION')}</div><h3>${esc(x.title||x.date||'Update')}</h3><p class="muted">${esc((x.improved||x.changes||[]).join(' · '))}</p></div>`).join('')||'<div class="card">Version log unavailable offline.</div>'}</div>`)}
mount();
})();
</script></body></html>
