async function overview(el){el.innerHTML=head('overview','damarakam mission control','live Mac telemetry, shortcuts, AI readiness')+`<div class="vbody"><div class="grid cols"><section class="card" style="grid-column:span 8"><div class="k">CHINNA MISSION CONTROL</div><h1 style="font-size:28px">damarakam mission control</h1><p class="muted">Every widget below is connected to Python backend routes. Use Refresh to re-poll.</p><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="chip on" id="netpill">● checking</span><span class="chip mono" id="ippill">ip</span><span class="chip mono" id="chip">chip</span><span class="chip mono" id="ver">v7</span></div></section><section class="card" style="grid-column:span 4"><div class="k">MAC VITALS</div><div class="grid" style="grid-template-columns:1fr 1fr">${['CPU','RAM','DISK','BATTERY'].map((x,i)=>`<div class="stat"><small>${x}</small><br><b class="${['green','blue','red','amber'][i]}" data-m="${x.toLowerCase()}">--</b><div class="muted mono" data-d="${x.toLowerCase()}">loading</div></div>`).join('')}</div></section><section class="card" style="grid-column:span 4"><div class="k">OPEN WEATHER</div><div style="font-size:48px;font-weight:950">29°</div><b class="blue">Partly Cloudy</b><p class="muted">Hyderabad · static fallback until weather key exists</p></section><section class="card" style="grid-column:span 4"><div class="k">SHORTCUTS · DIRECT ACCESS</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[['Studio','studio'],['Files','files'],['Apps','apps'],['Plugins','plugins'],['Duplicates','duplicates'],['Settings','settings']].map(x=>`<button class="btn" data-go="${x[1]}">${x[0]}</button>`).join('')}</div><div class="grid" style="grid-template-columns:1fr 1fr;gap:6px;margin-top:10px"><button class="btn danger" data-call="/api/purge">Purge RAM</button><button class="btn" data-call="/api/clean">Deep Clean</button><button class="btn" data-go="files">Scan Files</button><button class="btn" d async function studioSend(text){text=(text||'').trim();if(!text)return;let el=$('[data-view="studio"]');if(!el.classList.contains('on'))go('studio');el=$('[data-view="studio"]');if(isBuild(text)){ $('.studioHero',el).style.display='none';$('.studioBuild',el).classList.add('on');let th=$('.buildThread',el),a=msg(th,'CHINNA','Building that now...');msg(th,'YOU',text);let term=$('.term',el);term.textContent=`$ chinna build ${text}\nconnecting to /api/agent...\n`;try{let r=await fetch('/api/agent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,mode:'build',model:S.model,history:S.hist})});let reader=r.body&&r.body.getReader();if(reader){let dec=new TextDecoder(),buf='';while(true){let x=await reader.read();if(x.done)break;buf+=dec.decode(x.value,{stream:true});let parts=buf.split('\n\n');buf=parts.pop();for(let p of parts){let line=p.split('\n').find(y=>y.startsWith('data:'));if(line)agentEvent(JSON.parse(line.slice(5)),a,el)}}}await latestArtifact(el)}catch(e){a.querySelector('.bubble').textContent='Agent error: '+e.message;term.textContent+='\nerror: '+e.message}}else{$('.studioHero',el).style.display='none';$('.studioChat',el).classList.add('on');let th=$('.chatThread',el);msg(th,'YOU',text);let a=msg(th,'CHINNA','Thinking...');let j=await P('/api/chat',{message:text,model:S.model,history:S.hist});a.querySelector('.bubble').textContent=j.reply||j.error||'No response';S.hist=j.history||S.hist}}function agentEvent(ev,a,el){if(ev.type==='text'){let b=a.querySelector('.bubble');b.textContent=(b.textContent==='Building that now...'?'':b.textContent+'\n')+ev.content}if(ev.type==='tool_start')$('.term',el).textContent+=`\n$ ${ev.tool} running`;if(ev.type==='tool_result')$('.term',el).textContent+=`\n✓ ${ev.tool} complete\n${String(ev.result||'').slice(0,1000)}`;if(ev.type==='artifact'){S.artifact=ev.meta;loadArtifact(el,ev.meta.id)}if(ev.type==='error')a.querySelector('.bubble').textContent=ev.content;if(ev.type==='done'&&ev.art async function mac(el){el.innerHTML=head('mac','Mac','doctor · ports · system report · shell · music')+`<div class="vbody"><div class="grid cols"><div class="card" style="grid-column:span 4"><div class="k">ACTIONS</div><button class="btn" data-call="GET /api/doctor">Doctor</button><button class="btn" data-call="GET /api/ports">Ports</button><button class="btn" data-call="GET /api/sysreport">Sysreport</button><button class="btn" data-call="/api/launch-cli">Launch CLI</button><button class="btn" data-call="/api/install-swiftbar">SwiftBar</button><button class="btn" data-call="/api/install-app">Install App</button></div><div class="card" style="grid-column:span 4"><div class="k">SHELL</div><textarea id="shellCode">pwd && ls</textarea><button class="btn primary" id="runShell">Run safe shell</button><pre class="term" id="shellOut"></pre></div><div class="card" style="grid-column:span 4"><div class="k">MUSIC</div>${['play','pause','next','previous','playpause'].map(a=>`<button class="btn" data-music="${a}">${a}</button>`).join('')}</div><div class="card" style="grid-column:span 12"><div class="k">LIVE STATS</div><pre class="term" id="macStats">loading...</pre></div></div></div>`;$('#runShell',el).onclick=()=>P('/api/shell',{lang:'bash',code:$('#shellCode',el).value}).then(j=>$('#shellOut',el).textContent=j.result||j.error||'');$$('[data-music]',el).forEach(b=>b.onclick=()=>P('/api/music',{action:b.dataset.music}).then(toast));$('#macStats',el).textContent=JSON.stringify(await J('/api/stats'),null,2)}

async function connect(el){el.innerHTML=head('connect','Connect','AI keys · Telegram · TURN · extension · WhatsApp')+`<div class="vbody"><div class="grid cols"><div class="card" style="grid-column:span 4"><div class="k">KEY STATUS</div><pre class="term" id="keyStatus">loading...</pre></div><div class="card" style="grid-column:span 4"><div class="k">TELEGRAM</div><button class="btn primary" id="tgPair">Pair</button><button class="btn" id="tgStatus">Status</button><button class="btn" id="tgTest">Test Message</button><pre class="term" id="tgOut"></pre></div><div class="card" style="grid-column:span 4"><div class="k">TURN RELAY</div><textarea id="turnUrls" placeholder="TURN URLs"></textarea><button class="btn primary" id="turnGen">Generate TURN</button></div><div class="card" style="grid-column:span 6"><div class="k">EXTENSION KEYS</div><input class="field" id="extKey" value="KIE_API_KEY"><button class="btn" id="extRead">Read extension key</button><pre class="term" id="extOut"></pre></div><div class="card" style="grid-column:span 6"><div class="k">WHATSAPP STATUS</div><button class="btn" id="waConn">Check WhatsApp</button><pre class="term" id="waConnOut"></pre></div></div></div>`;$('#keyStatus',el).textContent=JSON.stringify(await J('/api/get_keys'),null,2);$('#tgPair',el).onclick=()=>P('/api/telegram/pair',{}).then(j=>$('#tgOut',el).textContent=JSON.stringify(j,null,2));$('#tgStatus',el).onclick=()=>J('/api/telegram/status').then(j=>$('#tgOut',el).textContent=JSON.stringify(j,null,2));$('#tgTest',el).onclick=()=>P('/api/telegram/test',{message:'Chinna test'}).then(j=>$('#tgOut',el).textContent=JSON.stringify(j,null,2));$('#turnGen',el).onclick=()=>P('/api/turn/generate',{turn_urls:$('#turnUrls',el).value}).then(toast);$('#extRead',el).onclick=()=>J('/api/ext/key?name='+encodeURIComponent($('#extKey',el).value)).then(j=>$('#extOut',el).textContent=JSON.stringify(j,null,2));$('#waConn',el).onclick=()=>J('/api/whatsapp/status').then(j=>$('#waConnOut',el).textContent=JSON.stringify(j,null,2))}
async function settings(el){el.innerHTML=head('settings','Settings','API keys · models · automation · installer · layout')+`<div class="vbody"><div class="grid cols"><div class="card" style="grid-column:span 4"><div class="k">API KEYS</div><label>OpenRouter</label><input class="field" id="orKey" type="password" placeholder="sk-or"><label>OpenAI</label><input class="field" id="oaKey" type="password"><label>Telegram token</label><input class="field" id="tgToken"><label>Telegram chat</label><input class="field" id="tgChat"><button class="btn primary" id="saveKeys">Save Keys</button></div><div class="card" style="grid-column:span 4"><div class="k">MODELS</div><div id="modelList"></div><input class="field" id="customModel" placeholder="custom model id"><button class="btn primary" id="setCustomModel">Set Custom</button></div><div class="card" style="grid-column:span 4"><div class="k">SYSTEM</div><button class="btn" data-call="/api/update">Update</button><button class="btn" data-call="/api/launch-cli">Launch CLI</button><button class="btn" data-call="/api/install-app">Install Mac App</button><button class="btn" data-call="/api/install-swiftbar">Install SwiftBar</button><button class="btn" id="checkUpdate">Check Update</button><button class="btn" id="clearChat">Clear AI Memory</button></div><div class="card" style="grid-column:span 6"><div class="k">LAYOUT JSON</div><textarea id="layoutJson"></textarea><button class="btn primary" id="saveLayout">Save Layout</button></div><div class="card" style="grid-column:span 6"><div class="k">CUSTOM VIEWS JSON</div><textarea id="viewsJson"></textarea><button class="btn primary" id="saveViews">Save Views</button></div></div></div>`;let m=await J('/api/models'),lay=await J('/api/ui-layout'),views=await J('/api/custom-views');$('#modelList',el).innerHTML=Object.entries(m.presets||{}).map(([key,val])=>`<button class="btn ${val==m.active?'primary':''}" data-preset="${E(key)}">${E(key)} · ${E(val)}</button>`).join('');$$('[data-preset]',el).forEach(b=>b.onclick=()=>P('/api/model-set',{preset:b.dataset.preset}).then(j=>{S.model=j.active||S.model;toast(j)}));$('#saveKeys',el).onclick=()=>P('/api/save_keys',{chinna_ai_key:$('#orKey',el).value,openai_key:$('#oaKey',el).value,telegram_token:$('#tgToken',el).value,telegram_chat:$('#tgChat',el).value}).then(toast);$('#setCustomModel',el).onclick=()=>P('/api/model-set',{custom:$('#customModel',el).value}).then(toast);$('#checkUpdate',el).onclick=()=>J('/api/check-update').then(toast);$('#clearChat',el).onclick=()=>P('/api/chat/clear',{}).then(toast);$('#layoutJson',el).value=JSON.stringify(lay.layout||{},null,2);$('#viewsJson',el).value=JSON.stringify(views.views||[],null,2);$('#saveLayout',el).onclick=()=>P('/api/ui-layout',{layout:JSON.parse($('#layoutJson',el).value||'{}')}).then(toast);$('#saveViews',el).onclick=()=>P('/api/custom-views',{views:JSON.parse($('#viewsJson',el).value||'[]')}).then(toast)}
async function changelog(el){let d=await J('/api/version-log');el.innerHTML=head('changelog','Changelog','version log and upgrade history')+`<div class="vbody"><div class="grid">${(d.versions||[]).map(v=>`<div class="card"><div class="k">${E(v.version)}</div><h3>${E(v.title||'Chinna update')}</h3><p class="muted">${E([...(v.improved||[]),...(v.resolved||[])].join(' · '))}</p></div>`).join('')||'<div class="card">No version log available.</div>'}<div class="card"><div class="k">HISTORY</div><pre class="term">${E(JSON.stringify(d.history||[],null,2))}</pre></div></div></div>`}function watchJob(id){if(!id){toast('No job id returned');return}drawer(`<button class="btn" data-close>Close</button><h3>Job ${id}</h3><pre class="term" id="jobOut">starting...</pre>`);let int=setInterval(async()=>{let j=await J('/api/job?id='+id);$('#jobOut').textContent=(j.lines||[]).join('\n');if(j.done){clearInterval(int);toast(j.ok?'Job complete':'Job failed')}},900)}mount();setInterval(()=>{if(S.view==='overview')render('overview')},8000);
})();
</script></body></html>
