x;border-bottom:1px solid var(--line);vertical-align:top}.table tr:hover{background:rgba(255,255,255,.03)}.stat{border:1px solid var(--line);padding:9px;border-radius:2px}.stat b{font-size:26px;line-height:1}.green{color:var(--green)}.blue{color:var(--blue)}.red{color:var(--red)}.amber{color:var(--yellow)}.pink{color:var(--pink)}.violet{color:var(--violet)}.toast{position:fixed;right:14px;bottom:14px;max-width:520px;z-index:100;background:#080808;border:1px solid var(--line2);padding:10px 12px;border-radius:2px;display:none;white-space:pre-wrap}.toast.show{display:block}.drawer{position:fixed;right:0;top:48px;bottom:0;width:min(760px,94vw);z-index:80;background:#080808;border-left:1px solid var(--line2);padding:12px;overflow:auto;transform:translateX(105%);transition:.2s}.drawer.show{transform:translateX(0)}.hero{height:100%;position:relative;display:grid;place-items:center;overflow:hidden}.blob{position:absolute;border-radius:999px;filter:blur(58px);opacity:.16}.b1{width:380px;height:210px;background:var(--acc);left:24%;top:26%}.b2{width:330px;height:230px;background:var(--violet);right:16%;top:34%}.b3{width:300px;height:150px;background:var(--blue);right:30%;top:40%}.heroCore{width:min(760px,92vw);text-align:center;z-index:2;margin-top:-34px}.studioMark{display:inline-flex;align-items:center;gap:10px;color:var(--t4);font:900 10px var(--mono);letter-spacing:3px;margin-bottom:18px}.studioMark i{width:30px;height:30px;border-radius:7px;background:var(--acc);color:#030a00;display:grid;place-items:center;font-style:normal}.hero h1{font-size:clamp(34px,5.4vw,62px);letter-spacing:-3px;line-height:.9}.grad{background:linear-gradient(90deg,#baff29,#76ff03,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}.composer{margin-top:22px;border:1px solid var(--line2);border-radius:12px;background:rgba(8,8,8,.72);text-align:left}.composer textarea{width:100%;height:92px;border:0;background:transparent;outline:0;color:#fff;padding:16px;font-size:14px;resize:none}.bar{height:46px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}.model{height:28px;border:1px solid var(--accbd);background:var(--accbg);color:var(--acc);border-radius:999px;padding:0 10px;font:900 11px var(--mono);display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;background:var(--acc);border-radius:999px;box-shadow:0 0 12px var(--acc)}.send{width:32px;height:32px;border:1px solid var(--line2);background:transparent;border-radius:2px}.send.ready{background:var(--acc);border-color:var(--acc);color:#030a00}.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:20px}.studioChat,.studioBuild{height:100%;display:none}.studioChat.show{display:flex;justify-content:center}.threadShell{width:min(900px,94vw);height:100%;position:relative}.thread{height:100%;overflow:auto;padding:60px 0 150px}.msg{display:flex;flex-direction:column;max-width:660px;margin-bottom:20px}.msg.user{margin-left:auto;align-items:flex-end}.meta{font:900 10px var(--mono);letter-spacing:1px;color:var(--t3);margin-bottom:6px}.msg.user .meta{color:var(--acc)}.bubble{border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:12px 14px;line-height:1.5;white-space:pre-wrap}.msg.user .bubble{border-color:var(--accbd);box-shadow:inset 0 0 16px rgba(186,255,41,.08)}.bottom{position:absolute;left:0;right:0;bottom:0;padding:36px 0 14px;background:linear-gradient(to top,#080808 70%,transparent)}.studioBuild.show{display:block}.split{height:100%;display:flex}.leftPane{width:420px;min-width:280px;max-width:640px;border-right:1px solid var(--line);position:relative}.artifact{flex:1;min-width:0;display:flex;flex-direction:column}.tabs{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:18px;padding:0 14px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);padding-bottom:10px}.tab.active{color:#fff;border-color:var(--acc)}.pane{flex:1;display:none;overflow:auto}. <script>
(function(){'use strict';

var state={view:(location.hash||'#overview').slice(1),model:'openrouter/free',history:[],artifact:null,chatId:'',lastFiles:[]};
function $(s,r){return (r||document).querySelector(s)}function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}function api(u,o){return fetch(u,o||{}).then(function(r){return r.text().then(function(t){try{return JSON.parse(t)}catch(e){return{ok:r.ok,status:r.status,text:t}}})}).catch(function(e){return{error:e.message}})}function post(u,b){return api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})}function fmt(n){n=Number(n||0);return n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':n>1e3?(n/1e3).toFixed(1)+' KB':n+' B'}function toast(m){var t=$('#toast');t.textContent=typeof m==='string'?m:JSON.stringify(m,null,2);t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('show')},3200)}function openDrawer(html){var d=$('#drawer');d.innerHTML=html;d.classList.add('show');var c=d.querySelector('[data-close]');if(c)c.focus()}function closeDrawer(){var d=$('#drawer');d.classList.remove('show')}
function boot(){var top=$('#topnav'),side=$('#side'),content=$('#content');top.innerHTML=NAV.slice(0,7).map(function(n){return '<button data-go="'+n[0]+'">'+n[1]+'</button>'}).join('');side.innerHTML=NAV.map(function(n){return '<button data-go="'+n[0]+'" aria-label="'+n[1]+'"><span aria-hidden="true">'+n[2]+'</span><span class="label">'+n[1]+'</span></button>'}).join('');content.innerHTML=NAV.map(function(n){return '<section class="view" data-view="'+n[0]+'" role="region" aria-label="'+n[1]+'"></section>'}).join('');document.body.addEventListener('click',onClick);$('#hamb').onclick=function(){$('#side').classList.toggle('open')};$('#search').onkeydown=function(e){if(e.key==='Enter'){go('files');setTimeout(function(){searchFiles($('#search').value)},80)}};window.onhashchange=function(){var v=(location.hash||'#overview').slice(1);if(v!==state.view)go(v)};go(state.view||'overview')}
function onClick(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.close)closeDrawer();if(b.dataset.go)go(b.dataset.go);if(b.dataset.refresh)render(state.view);if(b.dataset.call)callAction(b.dataset.call,b.dataset.body)}function callAction(ep,body){var payload={};try{payload=body?JSON.parse(body):{}}catch(e){};toast('Running '+ep);(ep.indexOf('GET ')==0?api(ep.slice(4)):post(ep,payload)).then(toast)}function go(v){state.view=v||'overview';history.replaceState(null,'','#'+state.view);$all('.view').forEach(function(x){x.classList.toggle('active',x.dataset.view===state.view)});$all('[data-go]').forEach(function(x){x.classList.toggle('active',x.dataset.go===state.view)});render(state.view)}function head(id,title,sub){return '<div class="vhead"><h1>'+title+'</h1><span class="sub">'+(sub||'')+'</span><span style="flex:1"></span><button class="btn" data-refresh="1">Refresh</button></div>'}function render(v){var el=$('.view[data-view="'+v+'"]');if(!el)return;({overview:overview,studio:studio,files:files,apps:apps,plugins:plugins,duplicates:duplicates,whatsapp:whatsapp,secure:secure,webviews:webviews,mac:mac,projects:projects,connect:connect,settings:settings,changelog:changelog}[v]||overview)(el)}function composer(ph){return '<div class="composer"><textarea aria-label="Composer" placeholder="'+esc(ph)+'"></textarea><div class="bar"><button class="model" aria-label="Model"><span class="dot"></span><span>'+esc(state.model.indexOf('free')>=0?'chinna/free':'chinna/auto')+'</span></button><button class="btn" data-attach aria-label="Attach or import">+</button><span style="flex:1"></span><span class="muted mono">enter send</span><button class="send" aria-label="Send">↑</button></div></div>'}function bindComposer(root){$all('.composer textarea',root).forEach(function(ta){ta.oninput=function(){var s=$('.send',ta.closest('.composer'));if(s)s.classList.toggle('ready',!!ta.value.trim())};ta.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();studioSend(ta.value);ta.value='';ta.dispatchEvent(new Event('input'))}}});$all('.send',root).forEach(function(b){b.onclick=function(){var ta=$('textarea',b.closest('.composer'));studioSend(ta.value);ta.value='';ta.dispatchEvent(new Event('input'))}});$all('[data-attach]',root).forEach(function(b){b.onclick=function(){openMediaImport()}})}
function overview(el){el.innerHTML=head('overview','damarakam mission control','compact live telemetry and shortcuts')+'<div class="vbody"><div class="grid cols"><section class="card" style="grid-column:span 8"><div class="k">Mission Control</div><h2>damarakam mission control</h2><p class="muted">ARIA/WCAG-aware compact dashboard. Controls call Python backend routes and report status.</p><div class="toolrow"><span class="chip" id="net">checking</span><span class="chip mono" id="ip">ip</span><span class="chip mono" id="chip">chip</span><span class="chip mono" id="modelTag">model</span></div></section><section class="card" style="grid-column:span 4"><div class="k">Vitals</div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat"><small>CPU</small><br><b class="green" id="cpu">--</b></div><div class="stat"><small>RAM</small><br><b class="blue" id="ram">--</b></div><div class="stat"><small>DISK</small><br><b class="red" id="disk">--</b></div><div class="stat"><small>BATTERY</small><br><b class="amber" id="bat">--</b></div></div></section><section class="card" style="grid-column:span 4"><div class="k">Shortcuts</div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="btn" data-go="studio">Studio</button><button class="btn" data-go="files">Files</button><button class="btn" data-go="apps">Apps</button><button class="btn" data-go="plugins">Plugins</button><button class="btn" data-go="whatsapp">WhatsApp</button><button class="btn" data-go="settings">Settings</button></div></section><section class="card" style="grid-column:span 4"><div class="k">Mac Actions</div><div class="grid" style="grid-template-columns:1fr 1fr"><button class="btn danger" data-call="/api/purge">Purge RAM</button><button class="btn" data-call="/api/clean">Deep Clean</button><button class="btn" data-call="GET /api/doctor">Doctor</button><button class="btn" data-call="GET /api/ports">Ports</button></div></section><section class="card" style="grid-column:span 4"><div class="k">AI Readiness</div><div id="aiStat" class="muted">checking...</div><button class="btn primary" data-go="studio" style="margin-top:10px">Open Studio</button></section><section class="card" style="grid-column:span 6"><div class="k">Quick AI</div>'+composer('Ask Chinna — chat, code, Mac control')+'</section><section class="card" style="grid-column:span 6"><div class="k">Quick Terminal</div><pre class="term" id="overviewTerm">loading...</pre></section></div></div>';bindComposer(el);api('/api/stats').then(function(s){$('#cpu',el).textContent=((s.cpu&&s.cpu.pct)||0)+'%';$('#ram',el).textContent=((s.memory&&s.memory.pct)||0)+'%';$('#disk',el).textContent=((s.disk&&s.disk.pct)||0)+'%';$('#bat',el).textContent=((s.battery&&s.battery.pct)||0)+'%';$('#net',el).textContent=(s.network&&s.network.status)||'offline';$('#ip',el).textContent=(s.network&&s.network.ip)||'offline';$('#chip',el).textContent=((s.os&&s.os.chip)||'Mac').replace('Apple ','').slice(0,22);$('#overviewTerm',el).textContent=JSON.stringify(s,null,2).slice(0,1600)});api('/api/ai/status').then(function(a){$('#aiStat',el).textContent=a.label||a.ai_status||a.error||'status unavailable'});api('/api/models').then(function(m){$('#modelTag',el).textContent=m.active_display||m.active||state.model})}

function mediaKind(name){name=(name||'').toLowerCase();if(/\.(png|jpe?g|gif|webp|svg|bmp|heic)$/.test(name))return'image';if(/\.(mp3|wav|m4a|aac|flac|ogg|oga)$/.test(name))return'audio';if(/\.(mp4|webm|mov|m4v|avi|mkv)$/.test(name))return'video';return''}function mediaUrl(path){return '/api/media?path='+encodeURIComponent(path||'')}function previewFile(f){if(!f){toast('No file selected');return}var kind=mediaKind(f.name||f.path),path=f.path||f.name,url=mediaUrl(path);openMediaPanel(kind,f.name||path,path,url,false)}function previewLocalFile(file){var kind=mediaKind(file.name),url=URL.createObjectURL(file);openMediaPanel(kind,file.name,'local file',url,true)}function openMediaPanel(kind,name,path,url,local){var body='<button class="btn" data-close>Close</button><h2>'+esc(name)+'</h2><p class="muted mono">'+esc(path)+'</p><div class="toolrow"><button class="btn" id="copyPath">Copy path</button><button class="btn" id="openRaw">Open raw</button><button class="btn" id="downloadMedia">Download</button><button class="btn primary" id="fitMedia">Fit</button></div><div class="mediaStage" id="mediaStage">';if(kind==='image')body+='<img id="mediaEl" alt="Preview of '+esc(name)+'" src="'+esc(url)+'">';else if(kind==='audio')body+='<audio id="mediaEl" controls src="'+esc(url)+'"></audio>';else if(kind==='video')body+='<video id="mediaEl" controls playsinline src="'+esc(url)+'"></video>';else body+='<div class="card">Preview unsupported. Use Reveal or Open raw.</div>';body+='</div><div id="mediaTools"></div>';openDrawer(body);$('#copyPath').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(path);toast('Path copied')};$('#openRaw').onclick=function(){window.open(url,'_blank')};$('#downloadMedia').onclick=function(){var a=document.createElement('a');a.href=url;a.download=name||'media';a.click()};$('#fitMedia').onclick=function(){var m=$('#mediaEl');if(m){m.style.maxWidth='100%';m.style.maxHeight='68vh'}};if(kind==='image')imageTools();if(kind==='audio')audioTools
