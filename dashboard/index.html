<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chinna v7.0</title>
<link rel="icon" href="assets/chinna-favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root,[data-theme="dark"]{
  --bg:#000000;--s0:#0f0f0f;--s1:#181818;--s2:#222222;--s3:#2a2a2a;
  --line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.18);--line3:rgba(255,255,255,.32);
  --t1:#ffffff;--t2:#c8c8c8;--t3:#b4b4b4;--t4:rgba(255,255,255,.42);
  --acc:#baff29;--acc2:#ff2d55;--acc-bg:rgba(186,255,41,.12);--acc-bd:rgba(186,255,41,.35);--accr:186,255,41;
  --green:#2edd5e;--red:#ff3333;--amber:#ffc700;--blue:#0080ff;
  --purple:#d54cff;--pink:#ff1744;--teal:#00d9ff;--orange:#ff8c00;
  --cyan:#00e5ff;--violet:#9d4edd;--lime:#76ff03;--indigo:#3c3ff2;
  --sh-sm:0 1px 3px rgba(0,0,0,.8);
  --sh-md:0 4px 20px rgba(0,0,0,.9);
  --sh-lg:0 16px 56px rgba(0,0,0,.95);
  --glow:rgba(186,255,41,.28);
  --font:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}

*,::before,::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--t1);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100%;width:100%}

/* Scrollbars */
*::-webkit-scrollbar{width:3px;height:3px}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:2px}
*::-webkit-scrollbar-track{background:transparent}

/* Selection */
::selection{background:rgba(186,255,41,.28)}

/* Focus */
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}

/* Buttons & inputs */
button,input,textarea,select{font-family:var(--font);cursor:pointer}
input,textarea,select{color-scheme:dark;cursor:text}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* Utility */
.spin{display:inline-block;animation:spin .7s linear infinite}

/* Responsive header tabs */
@media (max-width:768px){
  header nav{display:none !important}
}
</style>
</head>
<body>
<div id="root"></div>

<!-- React 18 + Babel for JSX transpilation -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
  integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
  integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
  integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Shared utilities (plain JS, no JSX) -->
<script src="Shared.jsx"></script>

<!-- JSX components — order matters: deps before consumers -->
<script type="text/babel" src="Charts.jsx"></script>
<script type="text/babel" src="Dock.jsx"></script>
<script type="text/babel" src="MediaPlayer.jsx"></script>
<script type="text/babel" src="FilePreviewModal.jsx"></script>

<!-- Views -->
<script type="text/babel" src="views/OverviewView.jsx"></script>
<script type="text/babel" src="views/StudioView.jsx"></script>
<script type="text/babel" src="views/FilesView.jsx"></script>
<script type="text/babel" src="views/AppsView.jsx"></script>
<script type="text/babel" src="views/PluginsView.jsx"></script>
<script type="text/babel" src="views/DuplicatesView.jsx"></script>
<script type="text/babel" src="views/SettingsView.jsx"></script>
<script type="text/babel" src="views/WhatsAppView.jsx"></script>
<script type="text/babel" src="views/SecureChatView.jsx"></script>
<script type="text/babel" src="views/WebViewsView.jsx"></script>

<!-- App shell (mounts React, must be last) -->
<script type="text/babel" src="App.jsx"></script>
</body>
</html>
