<style>
:root{--bg:#050505;--surface:#080808;--surface2:#0c0c0d;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);--text:#f7f7f7;--muted:#aaa;--soft:#747474;--acc:#baff29;--acc2:#50b1c9;--blue:#0a84ff;--pink:#ff375f;--yellow:#ffd60a;--green:#30d158;--red:#ff453a;--violet:#bf5af2;--orange:#ff9500;--radius:10px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--font);overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#2b2b2e;border-radius:99px}:focus-visible{outline:1px solid var(--acc);outline-offset:2px}.app{height:100%;display:grid;grid-template-rows:52px 38px 1fr;background:radial-gradient(600px 280px at 26% 16%,rgba(186,255,41,.055),transparent 70%),radial-gradient(580px 320px at 80% 10%,rgba(191,90,242,.055),transparent 70%),#050505}.top{height:52px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:rgba(5,5,5,.92);backdrop-filter:blur(14px);z-index:30}.brand{height:52px;width:132px;display:flex;align-items:center;gap:8px;padding:0 12px;border-right:1px solid var(--line)}.mark{width:24px;height:24px;border-radius:6px;background:var(--acc);color:#061000;font-weight:950;display:grid;place-items:center}.brand b{font-size:11px;letter-spacing:2px}.brand small{color:var(--acc);font:800 9px var(--mono)}.nav{display:flex;gap:16px;height:52px;align-items:flex-end;padding:0 16px;flex:1;overflow:auto}.nav button{height:52px;background:0;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:0 0 13px;white-space:nowrap}.nav button.active{color:#fff;border-color:var(--acc);font-weight:800}.tools{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding:0 12px;height:52px}.search{width:230px;height:31px;background:#070707;border:1px solid var(--line2);border-radius:3px;padding:0 11px;outline:0}.icon,.btn,.chip{border:1px solid var(--line2);background:rgba(255,255,255,.015);border-radius:4px;height:31px;padding:0 11px;color:var(--muted)}.icon{width:31px;padding:0;display:grid;place-items:center}.btn:hover,.icon:hover,.chip:hover{background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.23);color:#fff}.btn.primary{background:var(--acc);border-color:var(--acc);color:#061000;font-weight:900}.btn.danger{color:var(--red);border-color:rgba(255,69,58,.32)}.chip{border-radius:999px;height:28px}.subnav{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);overflow:auto;background:rgba(5,5,5,.75)}.subnav button{border:0;background:0;color:var(--muted);height:38px;border-bottom:2px solid transparent}.subnav button.active{color:#fff;border-color:var(--acc)}.main{min-height:0;display:grid;grid-template-columns:54px 1fr}.side{border-right:1px solid var(--line);background:rgba(6,6,6,.88);display:flex;flex-direction:column;gap:6px;padding:10px 7px;transition:.18s;width:54px;overflow:hidden}.side.open{width:216px}.main:has(.side.open){grid-template-columns:216px 1fr}.side button{min-height:36px;border:1px solid transparent;background:0;color:var(--muted);border-radius:4px;display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:0 10px}.side button.active,.side button:hover{border-color:var(--line2);background:rgba(255,255,255,.045);color:#fff}.side .lab{display:none}.side.open .lab{display:inline}.workspace{min-width:0;overflow:hidden}.page{display:none;height:100%;min-height:0}.page.active{display:flex;flex-direction:column}.head{height:50px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(5,5,5,.55)}.head h1{font-size:15px;margin:0}.head p{margin:0;color:var(--soft);font-size:12px}.body{min-height:0;flex:1;overflow:auto;padding:10px 12px 18px}.grid{display:grid;gap:9px}.cols{grid-template-columns:repeat(12,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.005));padding:13px;min-height:70px}.card:hover{border-color:rgba(255,255,255,.16)}.k{font:900 10px/1 var(--mono);letter-spacing:3px;color:var(--acc);text-transform:uppercase;margin-bottom:10px}.muted{color:var(--muted)}.soft{color:var(--soft)}.mono{font-family:var(--mono)}.big{font-size:40px;line-height:.95;font-weight:950;letter-spacing:-2px}.mini{font-size:11px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.split{display:grid;grid-template-columns:1fr 494px;gap:9px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border:1px solid var(--line);border-radius:6px;padding:10px;background:#070707}.stat strong{font-size:28px;letter-spacing:-1.5px}.spark{height:46px;width:100%;display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:8px;vertical-align:middle}.table tr:hover{background:rgba(255,255,255,.025)}input.field,textarea,select{width:100%;background:#070707;border:1px solid var(--line2);border-radius:6px;min-height:34px;padding:8px 10px;outline:0}textarea{resize:vertical}.composer{border:1px solid var(--line2);border-radius:12px;background:#070707;overflow:hidden}.composer textarea{border:0;min-height:74px;background:transparent}.bar{height:42px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}.dot{width:8px;height:8px;background:var(--acc);border-radius:99px;box-shadow:0 0 12px var(--acc)}.send{margin-left:auto}.tile{border:1px solid var(--line);border-radius:8px;padding:10px;background:rgba(255,255,255,.018);min-height:70px}.tile button{width:100%}.weather{display:flex;gap:20px;align-items:center}.sun{font-size:42px}.shortcuts{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.shortcut{height:62px;border:1px solid var(--line2);background:#070707;border-radius:8px;display:grid;place-items:center;text-align:center;color:#ddd}.shortcut:hover{border-color:var(--acc);color:#fff}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(760px,96vw);background:#050505;border-left:1px solid var(--line2);z-index:80;transform:translateX(103%);transition:.18s;padding:12px;overflow:auto;box-shadow:-30px 0 80px rgba(0,0,0,.45)}.drawer.show{transform:translateX(0)}.drawerHead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.drawerHead h2{margin:0;font-size:16px}.toast{position:fixed;right:14px;bottom:14px;z-index:100;border:1px solid var(--line2);background:#070707;border-radius:8px;max-width:520px;padding:10px 12px;white-space:pre-wrap;display:none}.toast.show{display:block}.palette{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:none;place-items:start center;padding-top:9vh}.palette.show{display:grid}.pal{width:min(740px,94vw);background:#050505;border:1px solid var(--line2);border-radius:10px;padding:10px;box-shadow:0 24px 90px rgba(0,0,0,.5)}.pal button{width:100%;height:40px;text-align:left;border:0;border-bottom:1px solid var(--line);background:0;color:#ddd;padding:0 10px}.pal button:hover{background:rgba(255,255,255,.045)}.mediaStage{border:1px solid var(--line);min-height:360px;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#020202}.mediaStage img,.mediaStage video{max-width:100%;max-height:70vh}.mediaStage audio{width:min(640px,100%)}.studioHero{height:100%;display:grid;place-items:center;position:relative;overflow:hidden}.studioHero:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 240px at 30% 42%,rgba(186,255,41,.11),transparent 70%),radial-gradient(500px 260px at 70% 55%,rgba(80,177,201,.1),transparent 70%)}.heroCore{position:relative;width:min(760px,92vw);text-align:center}.heroCore h2{font-size:clamp(38px,6vw,68px);line-height:.92;margin:12px 0;letter-spacing:-4px}.grad{background:linear-gradient(90deg,var(--acc),#74ffac,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}.chatShell{height:100%;display:grid;grid-template-columns:420px 1fr}.thread{overflow:auto;padding:18px}.msg{margin-bottom:16px;max-width:660px}.msg.user{margin-left:auto;text-align:right}.bubble{display:inline-block;border:1px solid var(--line2);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.018);text-align:left}.msg.user .bubble{border-color:rgba(186,255,41,.35);box-shadow:inset 0 0 18px rgba(186,255,41,.07)}.artifact{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.tabs{height:42px;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:16px;padding:0 12px}.tabs button{border:0;background:0;color:var(--muted);padding:0 0 10px;border-bottom:2px solid transparent}.tabs button.active{color:#fff;border-color:var(--acc)}.pane{display:none;flex:1;min-height:0;overflow:auto}.pane.active{display:block}.pane iframe{width:100%;height:100%;border:0;background:#fff}.code,.term{font:12px/1.55 var(--mono);white-space:pre-wrap;padding:16px}.term{color:#42f074}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:1180px){.split{grid-template-columns:1fr}.shortcuts{grid-template-columns:repeat(4,1fr)}.rightCol{display:grid;grid-template-columns:1fr 1fr;gap:9px}}@media(max-width:820px){body{font-size:12px}.app{grid-template-rows:50px 36px 1fr}.brand{width:auto}.brand b,.brand small,.search{display:none}.main{grid-template-columns:1fr}.side{position:fixed;left:0;top:50px;bottom:0;z-index:60;transform:translateX(-110%);width:230px}.side.open{transform:translateX(0);width:230px}.side .lab{display:inline}.nav{gap:13px;padding:0 10px}.tools{border-left:0}.cols{grid-template-columns:1fr}.card{grid-column:auto!important}.shortcuts{grid-template-columns:repeat(2,1fr)}.statgrid,.rightCol{grid-template-columns:1fr}.chatShell{grid-template-columns:1fr}.artifact{display:none}.body{padding:8px}.big{font-size:34px}.heroCore h2{letter-spacing:-2px}.subnav{padding:0 10px}}

<body>
<div class="app" role="application" aria-label="Chinna dashboard">
<header class="top"><div class="brand"><button class="icon" id="sideToggle" aria-label="Open navigation">☰</button><span class="mark">C</span><b>CHINNA</b><small>v7</small></div><nav class="nav" id="topNav" aria-label="Primary"></nav><div class="tools"><label class="sr" for="globalSearch">Search</label><input id="globalSearch" class="search" placeholder="⌘K Search everything"><button class="icon" id="cmdBtn" aria-label="Command palette">⌘</button><button class="icon" data-refresh aria-label="Refresh">↻</button><button class="icon" data-go="settings" aria-label="Settings">?</button></div></header>
<nav class="subnav" id="subNav" aria-label="Quick sections"></nav>
<main class="main"><aside class="side" id="side" aria-label="Pages"></aside><section class="workspace" id="workspace"></section></main>
</div><aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-label="Details drawer"></aside><section class="palette" id="palette" role="dialog" aria-label="Command palette"><div class="pal"><input class="field" id="palInput" placeholder="Run command, open page, search files..."><div id="palList"></div></div></section><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const PAGES=[['overview','Overview','⌁'],['studio','Studio','◆'],['files','Files','▣'],['apps','Apps','▤'],['plugins','Plugins','✦'],['duplicates','Duplicates','◇'],['whatsapp','WhatsApp','●'],['secure','Secure','◉'],['webviews','Web Views','◎'],['mac','Mac','⌘'],['projects','Projects','⌂'],['connect','Connect','⇄'],['settings','Settings','⚙'],['trace','Trace','↯'],['changelog','Changelog','△']];
const TOP=['overview','studio','files','apps','plugins','duplicates','whatsapp'];const SUB=[['mac','▾ Mac'],['projects','▦ Projects'],['studio','🤖 AI'],['connect','↗ Connect'],['settings','⚙ Settings']];
let state={view:(location.hash||'#overview').slice(1),model:'openrouter/free',stats:null,files:[],artifact:null,chat:[]};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function api(u,o){return fetch(u,o||{}).then(r=>r.text().then(t=>{try{return JSON.parse(t)}catch{return{ok:r.ok,status:r.status,text:t}}})).catch(e=>({error:e.message}))}
function post(u,b){return api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})}
function toast(x){const t=$('#toast');t.textContent=typeof x==='string'?x:JSON.stringify(x,null,2);t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),3600)}
function fmt(n){n=+n||0;return n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':n>1e3?(n/1e3).toFixed(1)+' KB':n+' B'}
function head(title,sub,more=''){return `<div class="head"><h1>${title}</h1><p>${sub||''}</p><span style="flex:1"></span>${more}<button class="btn" data-refresh>Refresh</button></div>`}
function drawer(title,body){$('#drawer').innerHTML=`<div class="drawerHead"><h2>${title}</h2><span style="flex:1"></span><button class="btn" data-close>Close</button></div>${body}`;$('#drawer').classList.add('show')}
function closeDrawer(){ $('#drawer').classList.remove('show') }
function trace(action,payload={},result=null){let a=JSON.parse(localStorage.chinnaTrace||'[]');a.unshift({at:new Date().toISOString(),action,payload,result});a=a.slice(0,200);localStorage.chinnaTrace=JSON.stringify(a);post('/api/action/trace',{action,payload,result}).catch(()=>{})}
function checkpoint(label,scope){let a=JSON.parse(localStorage.chinnaCheckpoints||'[]');let cp={id:'cp_'+Date.now(),at:new Date().toISOString(),label,scope};a.unshift(cp);a=a.slice(0,100);localStorage.chinnaCheckpoints=JSON.stringify(a);post('/api/checkpoints',{checkpoint:cp}).catch(()=>{});return cp}
function boot(){ $('#topNav').innerHTML=TOP.map(id=>{let p=PAGES.find(x=>x[0]===id);return `<button data-go="${id}">${p[1]}</button>`}).join(''); $('#subNav').innerHTML=SUB.map(x=>`<button data-go="${x[0]}">${x[1]}</button>`).join(''); $('#side').innerHTML=PAGES.map(p=>`<button data-go="${p[0]}" aria-label="${p[1]}"><span>${p[2]}</span><span class="lab">${p[1]}</span></button>`).join(''); $('#workspace').innerHTML=PAGES.map(p=>`<section class="page" data-page="${p[0]}" aria-label="${p[1]}"></section>`).join(''); document.body.addEventListener('click',click); document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()} if(e.key==='Escape'){closeDrawer();closePalette(); if(innerWidth<821)$('#side').classList.remove('open')}}); $('#sideToggle').onclick=()=>$('#side').classList.toggle('open'); $('#cmdBtn').onclick=openPalette; $('#globalSearch').onkeydown=e=>{if(e.key==='Enter'){go('files');setTimeout(()=>searchFiles(e.target.value),120)}}; window.onhashchange=()=>go((location.hash||'#overview').slice(1)); go(state.view||'overview')}
function click(e){let b=e.target.closest('button'); if(!b)return; if(b.dataset.close){closeDrawer();return} if(b.dataset.go){go(b.dataset.go); if(innerWidth<821)$('#side').classList.remove('open');return} if(b.dataset.refresh){render(state.view);return} if(b.dataset.call){call(b.dataset.call);return}}
function go(id){state.view=id;history.replaceState(null,'','#'+id);$$('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===id));$$('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===id));render(id)}
function render(id){({overview,studio,files,apps,plugins,duplicates,whatsapp,secure,webviews,mac,projects,connect,settings,trace:tracePage,changelog}[id]||overview)($(`[data-page="${id}"]`))}
function call(ep,payload={}){trace('call '+ep,payload);toast('Running '+ep);(ep.startsWith('GET ')?api(ep.slice(4)):post(ep,payload)).then(r=>{trace('done '+ep,payload,r);toast(r.message||r.result||r.error||r)})}
function spark(color='#baff29'){return `<svg class="spark" viewBox="0 0 170 46" preserveAspectRatio="none"><polyline points="0,38 18,24 35,29 52,15 69,31 86,24 103,14 120,30 137,28 154,29 170,23" fill="none" stroke="${color}" stroke-width="2"/><path d="M0 46 L0 38 18 24 35 29 52 15 69 31 86 24 103 14 120 30 137 28 154 29 170 23 L170 46 Z" fill="${color}" opacity=".08"/></svg>`}
function composer(ph){return `<div class="composer"><textarea aria-label="Ask Chinna" placeholder="${ph}"></textarea><div class="bar"><span class="chip row"><span class="dot"></span><b class="mono">chinna/free</b></span><button class="btn" data-attach>+</button><span class="soft mono" style="margin-left:auto">enter send</span><button class="btn primary send">↑</button></div></div>`}
function bindComposer(root){$$('.composer textarea',root).forEach(t=>t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();studioSend(t.value);t.value=''}});$$('.composer .send',root).forEach(b=>b.onclick=()=>{let t=$('textarea',b.closest('.composer'));studioSend(t.value);t.value=''});$$('[data-attach]',root).forEach(b=>b.onclick=openImport)}

ow" style="margin-top:12px"><button class="btn danger" data-call="/api/purge">Purge RAM</button><button class="btn" data-call="/api/clean">Deep Clean</button><button class="btn" data-call="GET /api/doctor">Doctor</button><button class="btn" data-call="GET /api/ports">Ports</button></div></section><section class="card" style="grid-column:span 6"><div class="k">Quick AI</div>${composer('Hey! Ask anything — chat, code, Mac control, or describe what to build.')}</section><section class="card" style="grid-column:span 6"><div class="k">Activity</div><div id="activityList" class="grid"></div></section><section class="card" style="grid-column:span 7"><div class="k">Deep Links · Saved Sites</div><div class="shortcuts">${[['https://github.com','GitHub'],['https://wikipedia.org','Wikipedia'],['https://google.com','Search'],['https://weather.com','Weather'],['https://news.ycombinator.com','HN'],['https://chat.openai.com','AI']].map(x=>`<button class="shortcut" data-url="${x[0]}">🌐<small>${x[1]}</small></button>`).join('')}</div></section><section class="card" style="grid-column:span 5"><div class="k">Connect · Routes</div><div class="grid" style="grid-template-columns:repeat(2,1fr)"><button class="tile" data-go="whatsapp">💬<br><b>WhatsApp</b><br><span class="soft">Messages & calls</span></button><button class="tile" data-go="secure">🔒<br><b>Secure Chat</b><br><span class="soft">Encrypted AI chat</span></button><button class="tile" data-go="studio">🤖<br><b>AI Studio</b><br><span class="soft">Build · code · run</span></button><button class="tile" data-go="webviews">🌐<br><b>Web Views</b><br><span class="soft">Browser panes</span></button></div></section></div></div><aside class="rightCol"><section class="card"><div class="k">Mac · Vitals</div><div class="statgrid"><div class="stat"><span>CPU</span><br><strong id="cpu" style="color:var(--acc)">--</strong>${spark('#baff29')}</div><div class="stat"><span>RAM</span><br><strong id="ram" style="color:var(--blue)">--</strong>${spark('#0a function plugins(el){el.innerHTML=simplePage('Plugins','safe backend plugin runner',`<div class="grid cols" id="plugGrid">Loading…</div>`);api('/api/plugins').then(d=>{plugGrid.innerHTML=(d.plugins||[]).map(p=>`<div class="card" style="grid-column:span 4"><div class="k">${esc(p.category||'Plugin')}</div><h3>${esc(p.icon||'✦')} ${esc(p.name||p.id)}</h3><p class="muted">${esc(p.description||'Chinna plugin')}</p><div class="row">${(p.actions||[]).map(a=>`<button class="btn" data-pid="${esc(p.id)}" data-act="${esc(a.id||a.name)}">${esc(a.label||a.name||a.id)}</button>`).join('')}</div></div>`).join('')||'<p>No plugins returned.</p>';$$('[data-pid]').forEach(b=>b.onclick=()=>post('/api/plugins/action',{plugin:b.dataset.pid,action:b.dataset.act,payload:{}}).then(toast))})}
function duplicates(el){el.innerHTML=simplePage('Duplicates','scan and clean duplicate groups',`<div class="row"><button class="btn primary" id="scanDupes">Scan</button><button class="btn danger" id="trashDupes">Trash selected</button></div><table class="table"><tbody id="dupRows"></tbody></table>`);function load(){api('/api/files?tab=dupes&sort=size').then(d=>{dupRows.innerHTML=(d.files||[]).map(f=>`<tr><td><input type="checkbox" data-path="${esc(f.path)}"></td><td><b>${esc(f.name)}</b><div class="soft mono">${esc(f.path)}</div></td><td>${esc(f.size||fmt(f.size_bytes))}</td><td><button class="btn" data-path="${esc(f.path)}">Preview</button></td></tr>`).join('')||'<tr><td>No duplicates found.</td></tr>';$$('[data-path]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>previewFile({path:b.dataset.path,name:b.dataset.path.split('/').pop()})})})}scanDupes.onclick=load;trashDupes.onclick=()=>{checkpoint('Before duplicate trash','duplicates');post('/api/delete-dupes',{paths:$$('input:checked',el).map(x=>x.dataset.path)}).then(toast)};load()}
function whatsapp(el){el.innerHTML=simplePage('WhatsApp','bridge status · QR · chats',`<div class="row"><button class="btn" data-call="GET /api/whatsapp/status">Status</button><button class="btn" data-call="GET /api/whatsapp/qr">QR</button><button class="btn" data-call="/api/whatsapp/reconnect">Reconnect</button><button class="btn danger" data-call="/api/whatsapp/logout">Logout</button></div><div class="grid cols" style="margin-top:10px"><section class="card" style="grid-column:span 4"><div class="k">Chats</div><div id="waChats">Loading…</div></section><section class="card" style="grid-column:span 8"><div class="k">Messages</div><div id="waMsgs" style="min-height:260px"></div><div class="row"><input class="field" id="waInput" placeholder="Message"><button class="btn primary" id="waSend">Send</button></div></section></div>`);let current='';api('/api/whatsapp/chats').then(d=>{let arr=d.chats||d.items||[];waChats.innerHTML=(Array.isArray(arr)?arr:[]).map(c=>`<button class="btn" style="width:100%;margin-bottom:6px" data-chat="${esc(c.id||c.name)}">${esc(c.name||c.id||'chat')}</button>`).join('')||'<p class="muted">No chats. Pair QR first.</p>';$$('[data-chat]').forEach(b=>b.onclick=()=>{current=b.dataset.chat;api('/api/whatsapp/messages?chat='+encodeURIComponent(current)).then(m=>{let a=m.messages||m.items||[];waMsgs.innerHTML=(Array.isArray(a)?a:[]).map(x=>`<div class="bubble" style="margin:5px">${esc(x.body||x.text||x.message||'')}</div>`).join('')||'<p class="muted">No messages returned.</p>'})})});waSend.onclick=()=>current&&post('/api/whatsapp/send',{chat:current,to:current,message:waInput.value,text:waInput.value}).then(toast)}
function secure(el){el.innerHTML=simplePage('Secure Chat','private relay users and messages',`<div class="grid cols"><section class="card" style="grid-column:span 4"><div class="k">Identity</div><input class="field" id="secName" placeholder="Display name"><button class="btn primary" id="secReg">Register</button><pre class="term" id="secInfo"></pre></section><section class="card" style="grid-column:span 4"><div class="k">Users</div><button class="btn" id="secUsers">Load users</button><pre class="term" id="secList"></pre></section><section class="card" style="grid-column:span 4"><div class="k">Message</div><input class="field" id="secTo" placeholder="To user id"><textarea id="secMsg" placeholder="Message"></textarea><button class="btn primary" id="secSend">Send</button></section></div>`);let uid=localStorage.secUid||'',tok=localStorage.secToken||'';secInfo.textContent=uid?'id: '+uid:'not registered';secReg.onclick=()=>post('/api/chat/register',{name:secName.value||'Chinna User'}).then(j=>{uid=j.id||j.user_id||uid;tok=j.token||tok;localStorage.secUid=uid;localStorage.secToken=tok;secInfo.textContent=JSON.stringify(j,null,2)});secUsers.onclick=()=>api('/api/chat/users?id='+uid+'&token='+tok).then(j=>secList.textContent=JSON.stringify(j,null,2));secSend.onclick=()=>post('/api/chat/send',{from:uid,token:tok,to:secTo.value,message:secMsg.value}).then(toast)}
function webviews(el){el.innerHTML=simplePage('Web Views','save and open pages',`<div class="row"><input class="field" id="wvName" placeholder="Name"><input class="field" id="wvUrl" placeholder="https://"><button class="btn primary" id="wvAdd">Add</button><button class="btn" id="wvSave">Save</button></div><div class="grid cols" id="wvGrid" style="margin-top:10px"></div>`);let views=JSON.parse(localStorage.webviews||'[]');api('/api/custom-views').then(d=>{views=d.views&&d.views.length?d.views:views;draw()});function draw(){wvGrid.innerHTML=views.map((v,i)=>`<div class="card" style="grid-column:span 4"><b>${esc(v.name)}</b><p class="soft mono">${esc(v.url)}</p><button class="btn" data-url="${esc(v.url)}">Open</button> <button class="btn danger" data-rm="${i}">Remove</button></div>`).join('')||'<p>No views yet.</p>';$$('[data-url]').forEach(b=>b.onclick=()=>window.open(b.dataset.url,'_blank'));$$('[data-rm]').forEach(b=>b.onclick=()=>{views.splice(+b.dataset.rm,1);draw()})}wvAdd.onclick=()=>{views.push({name:wvName.value||'Site',url:wvUrl.value});draw()};wvSave.onclick=()=>{localStorage.webviews=JSON.stringify(views);post('/api/custom-views',{views}).then(toast)}}
function mac(el){el.innerHTML=simplePage('Mac','doctor · ports · shell · music',`<div class="grid cols"><section class="card" style="grid-column:span 4"><div class="k">Actions</div><div class="row"><button class="btn" data-call="GET /api/doctor">Doctor</button><button class="btn" data-call="GET /api/ports">Ports</button><button class="btn" data-call="GET /api/sysreport">Report</button><button class="btn" data-call="/api/install-app">Install App</button><button class="btn" data-call="/api/install-swiftbar">SwiftBar</button></div></section><section class="card" style="grid-column:span 4"><div class="k">Safe Shell</div><textarea id="shellCode">pwd && ls</textarea><button class="btn primary" id="runShell">Run</button><pre class="term" id="shellOut"></pre></section><section class="card" style="grid-column:span 4"><div class="k">Music</div>${['previous','playpause','next','pause','play'].map(a=>`<button class="btn" data-music="${a}">${a}</button>`).join(' ')}</section></div>`);runShell.onclick=()=>post('/api/shell',{lang:'bash',code:shellCode.value}).then(j=>shellOut.textContent=j.result||j.error||JSON.stringify(j,null,2));$$('[data-music]').forEach(b=>b.onclick=()=>post('/api/music',{action:b.dataset.music}).then(toast))}
function projects(el){el.innerHTML=simplePage('Projects','registry · run · setup · autopilot',`<div class="row"><input class="field" id="projPath" placeholder="~/project/path"><button class="btn primary" id="projRun">Run</button><button class="btn" id="projSetup">Setup</button><button class="btn" id="projAudit">Audit</button><button class="btn" id="projAuto">Autopilot</button></div><div class="grid cols" id="projGrid" style="margin-top:10px">Loading…</div>`);api('/api/projects').then(d=>{projGrid.innerHTML=(d.projects||[]).map(p=>`<div class="card" style="grid-column:span 4"><b>${esc(p.short_path||p.path)}</b><p class="soft mono">${esc(p.stack||'project')}</p><button class="btn" data-open="${esc(p.path)}">Reveal</button> <button class="btn primary" data-run="${esc(p.path)}">Run</button> <button class="btn" data-auto="${esc(p.path)}">Autopilot</button></div>`).join('')||'<p>No projects returned.</p>';$$('[data-open]').forEach(b=>b.onclick=()=>post('/api/project/open-folder?path='+encodeURIComponent(b.dataset.open)).then(toast));$$('[data-run]').forEach(b=>b.onclick=()=>post('/api/project/run',{path:b.dataset.run,install_deps:true}).then(j=>watchJob(j.job)));$$('[data-auto]').forEach(b=>b.onclick=()=>openProjectAutopilot(b.dataset.auto))});projRun.onclick=()=>post('/api/project/run',{path:projPath.value,install_deps:true}).then(j=>watchJob(j.job));projSetup.onclick=()=>post('/api/project/setup',{path:projPath.value,scaffold:true}).then(toast);projAudit.onclick=()=>post('/api/audit',{path:projPath.value}).then(j=>watchJob(j.job));projAuto.onclick=()=>openProjectAutopilot(projPath.value)}function openProjectAutopilot(path=''){drawer('Project Autopilot',`<input class="field" id="autoPath" value="${esc(path)}" placeholder="~/project/path"><div class="row" style="margin-top:10px"><button class="btn" id="autoDetect">Detect</button><button class="btn" id="autoSetup">Setup</button><button class="btn primary" id="autoRun">Make runnable</button><button class="btn" id="autoAudit">Audit</button></div><pre class="term" id="autoOut"></pre>`);autoDetect.onclick=()=>api('/api/forge/detect?path='+encodeURIComponent(autoPath.value)).then(j=>autoOut.textContent=JSON.stringify(j,null,2));autoSetup.onclick=()=>{checkpoint('Before project setup '+autoPath.value,'project');post('/api/project/setup',{path:autoPath.value,scaffold:true}).then(j=>autoOut.textContent=JSON.stringify(j,null,2))};autoRun.onclick=()=>{checkpoint('Before project run '+autoPath.value,'project');post('/api/project/run',{path:autoPath.value,install_deps:true}).then(j=>{autoOut.textContent=JSON.stringify(j,null,2);watchJob(j.job)})};autoAudit.onclick=()=>post('/api/audit',{path:autoPath.value}).then(j=>{autoOut.textContent=JSON.stringify(j,null,2);watchJob(j.job)})}
function connect(el){el.innerHTML=simplePage('Connect','keys · Telegram · TURN · extension',`<div class="grid cols"><section class="card" style="grid-column:span 4"><div class="k">Keys</div><pre class="term" id="keyStatus">Loading…</pre></section><section class="card" style="grid-column:span 4"><div class="k">Telegram</div><button class="btn" id="tgPair">Pair</button><button class="btn" id="tgStatus">Status</button><button class="btn" id="tgTest">Test</button><pre class="term" id="tgOut"></pre></section><section class="card" style="grid-column:span 4"><div class="k">Extension</div><button class="btn primary" onclick="window.open('chrome://extensions','_blank')">Open Extensions</button><button class="btn" id="waConn">WhatsApp Status</button><pre class="term" id="connOut"></pre></section></div>`);api('/api/get_keys').then(j=>keyStatus.textContent=JSON.stringify(j,null,2));tgPair.onclick=()=>post('/api/telegram/pair',{}).then(j=>tgOut.textContent=JSON.stringify(j,null,2));tgStatus.onclick=()=>api('/api/telegram/status').then(j=>tgOut.textContent=JSON.stringify(j,null,2));tgTest.onclick=()=>post('/api/telegram/test',{message:'Chinna test'}).then(j=>tgOut.textContent=JSON.stringify(j,null,2));waConn.onclick=()=>api('/api/whatsapp/status').then(j=>connOut.textContent=JSON.stringify(j,null,2))}
function settings(el){el.innerHTML=simplePage('Settings','AI keys · models · layout',`<div class="grid cols"><section class="card" style="grid-column:span 4"><div class="k">AI Keys</div><label>OpenRouter</label><input class="field" id="orKey" type="password" placeholder="sk-or"><label>OpenAI</label><input class="field" id="oaKey" type="password"><button class="btn primary" id="saveKeys">Save Keys</button><p class="soft">Installer now also asks for keys with skip option.</p></section><section class="card" style="grid-column:span 4"><div class="k">Models</div><div id="modelList" class="row"></div><input class="field" id="customModel" placeholder="custom/provider-model"><button class="btn primary" id="setModel">Set Model</button></section><section class="card" style="grid-column:span 4"><div class="k">System</div><button class="btn" data-call="/api/update">Update</button> <button class="btn" data-call="/api/install-app">Install App</button> <button class="btn" data-call="/api/install-swiftbar">SwiftBar</button> <button class="btn danger" id="clearMemory">Clear Memory</button></section></div>`);api('/api/models').then(m=>{modelList.innerHTML=Object.keys(m.presets||{}).map(k=>`<button class="btn" data-preset="${k}">${k}</button>`).join('');$$('[data-preset]').forEach(b=>b.onclick=()=>post('/api/model-set',{preset:b.dataset.preset}).then(toast))});saveKeys.onclick=()=>post('/api/save_keys',{OPENROUTER_API_KEY:orKey.value,OPENAI_API_KEY:oaKey.value,chinna_ai_key:orKey.value,openai_key:oaKey.value}).then(toast);setModel.onclick=()=>post('/api/model-set',{custom:customModel.value}).then(toast);clearMemory.onclick=()=>post('/api/chat/clear',{}).then(toast)}
function tracePage(el){let tr=JSON.parse(localStorage.chinnaTrace||'[]'),cp=JSON.parse(localStorage.chinnaCheckpoints||'[]');el.innerHTML=simplePage('Trace','actions · checkpoints · restore planning',`<div class="grid cols"><section class="card" style="grid-column:span 6"><div class="k">Actions</div><table class="table">${tr.map(t=>`<tr><td class="mono soft">${new Date(t.at).toLocaleString()}</td><td><b>${esc(t.action)}</b><pre class="soft mono">${esc(JSON.stringify(t.payload||{},null,2)).slice(0,220)}</pre></td></tr>`).join('')||'<tr><td>No trace yet.</td></tr>'}</table></section><section class="card" style="grid-column:span 6"><div class="k">Checkpoints</div><button class="btn" id="newCp">Create checkpoint</button><table class="table">${cp.map(c=>`<tr><td><b>${esc(c.label)}</b><div class="soft mono">${esc(c.scope)} · ${new Date(c.at).toLocaleString()}</div></td><td><button class="btn" data-restore="${c.id}">Restore plan</button></td></tr>`).join('')||'<tr><td>No checkpoints yet.</td></tr>'}</table></section></div>`);newCp.onclick=()=>{checkpoint('Manual checkpoint','manual');render('trace')};$$('[data-restore]').forEach(b=>b.onclick=()=>post('/api/restore-plan',{checkpoint_id:b.dataset.restore}).then(toast))}
function changelog(el){el.innerHTML=simplePage('Changelog','version history',`<div id="logGrid" class="grid">Loading…</div>`);api('/api/version-log').then(d=>{logGrid.innerHTML=(d.versions||[]).map(v=>`<div class="card"><div class="k">${esc(v.version)}</div><h3>${esc(v.title||'Chinna update')}</h3><p class="muted">${esc([].concat(v.improved||[],v.resolved||[]).join(' · '))}</p></div>`).join('')||'<p>No version log.</p>'})}
function watchJob(id){if(!id){toast('No job id');return}drawer('Job '+id,`<pre class="term" id="jobOut">Starting…</pre>`);let x=setInterval(()=>api('/api/job?id='+encodeURIComponent(id)).then(j=>{if($('#jobOut'))$('#jobOut').textContent=(j.lines||[]).join('\n')||JSON.stringify(j,null,2);if(j.done){clearInterval(x);toast(j.ok?'Job complete':'Job failed')}}),900)}
try{boot()}catch(e){document.body.insertAdjacentHTML('beforeend',`<pre style="position:fixed;inset:12px;z-index:999;background:#160b0d;color:#ff8a80;padding:12px;white-space:pre-wrap">Dashboard boot error: ${esc(e.message)}</pre>`)}}
})();
</script>
</body>
</html>
