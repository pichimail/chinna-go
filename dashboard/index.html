<style>
:root{--bg:#080808;--line:#1c1c1f;--line2:#262629;--line3:#333337;--t1:#fff;--t2:#adadad;--t3:#a1a1a1;--t4:rgba(255,255,255,.3);--acc:#baff29;--acc-bg:rgba(186,255,41,.08);--acc-bd:rgba(186,255,41,.25);--violet:#bf5af2;--pink:#ff375f;--yellow:#ffd60a;--blue:#0a84ff;--green:#30d158;--orange:#ff9500;--cyan:#50b1c9;--red:#ff453a;--mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;--font:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}textarea{resize:vertical}::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--line3)}.app{height:100%;display:flex;flex-direction:column}.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;background:#080808}.brand{height:56px;width:190px;border-right:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}.hamb,.icon{border:0;background:transparent;color:var(--t3)}.logo{width:28px;height:28px;border-radius:4px;background:var(--acc);color:#030a00;display:grid;place-items:center;font-weight:950}.word{font-size:12px;font-weight:900;letter-spacing:2px}.ver{font-size:9px;color:var(--acc);font-weight:900}.nav{height:56px;display:flex;align-items:end;gap:22px;padding:0 22px;flex:1;overflow:auto}.nav button{height:56px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);white-space:nowrap}.nav button.active{border-color:var(--acc);color:#fff;font-weight:800}.right{height:56px;border-left:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}.search{height:34px;width:220px;border:1px solid var(--line2);background:transparent;border-radius:2px;outline:0;padding:0 12px}.main{flex:1;min-height:0;display:flex}.side{width:58px;border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:7px;background:#080808}.side.open{width:220px}.side button{height:38px;border:1px solid transparent;background:transparent;color:var(--t3);border-radius:2px;display:flex;align-items:center;gap:10px;padding:0 11px}.side button:hover,.side button.active{border-color:var(--line2);background:rgba(255,255,255,.05);color:#fff}.side .label{display:none}.side.open .label{display:inline}.content{flex:1;min-width:0;overflow:hidden}.view{display:none;height:100%;min-height:0;flex-direction:column;background:#080808}.view.active{display:flex}.vhead{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}.vhead h2{font-size:15px}.sub{font-size:12px;color:var(--t3)}.vbody{flex:1;overflow:auto;padding:12px;min-height:0}.grid{display:grid;gap:8px}.cols{grid-template-columns:repeat(12,1fr)}.card{border:1px solid var(--line);background:transparent;border-radius:2px;padding:14px;min-height:80px}.card:hover{border-color:var(--line3)}.k{font:900 10px/1 var(--mono);letter-spacing:3px;color:var(--acc);text-transform:uppercase;margin-bottom:10px}.muted{color:var(--t3)}.mono{font-family:var(--mono)}.btn,.chip{height:34px;border:1px solid var(--line2);background:transparent;color:var(--t2);border-radius:2px;padding:0 12px}.chip{border-radius:999px}.btn:hover,.chip:hover{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.05);color:#fff}.btn.primary{background:var(--acc);border-color:var(--acc);color:#030a00;font-weight:900}.btn.danger{border-color:rgba(255,69,58,.3);color:var(--red)}.field,textarea,select{border:1px solid var(--line2);background:transparent;border-radius:2px;outline:0;padding:9px 11px;min-height:34px}.field:focus,textarea:focus,select:focus{border-color:rgba(186,255,41,.42);box-shadow:0 0 0 1px rgba(186,255,41,.2),0 0 24px rgba(186,255,41,.1)}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.table tr:hover{background:rgba(255,255,255,.03)}.stat{border:1px solid var(--line);padding:12px;border-radius:2px}.stat b{font-size:34px;line-height:1}.green{color:var(--green)}.blue{color:var(--blue)}.red{color:var(--red)}.amber{color:var(--yellow)}.purple{color:var(--violet)}.pink{color:var(--pink)}.toast{position:fixed;right:18px;bottom:18px;max-width:540px;z-index:100;background:#080808;border:1px solid var(--line2);padding:12px 14px;border-radius:2px;display:none;white-space:pre-wrap}.toast.show{display:block}.drawer{position:fixed;right:0;top:56px;bottom:0;width:min(540px,92vw);z-index:80;background:#080808;border-left:1px solid var(--line2);padding:16px;overflow:auto;transform:translateX(105%);transition:.2s}.drawer.show{transform:translateX(0)}.hero{height:100%;position:relative;display:grid;place-items:center;overflow:hidden}.blob{position:absolute;border-radius:999px;filter:blur(60px);opacity:.18}.b1{width:420px;height:230px;background:var(--acc);left:24%;top:26%}.b2{width:360px;height:250px;background:var(--violet);right:16%;top:34%}.b3{width:330px;height:170px;background:var(--blue);right:30%;top:40%}.heroCore{width:min(840px,92vw);text-align:center;z-index:2;margin-top:-40px}.studioMark{display:inline-flex;align-items:center;gap:12px;color:var(--t4);font:900 12px var(--mono);letter-spacing:4px;margin-bottom:22px}.studioMark i{width:34px;height:34px;border-radius:7px;background:var(--acc);color:#030a00;display:grid;place-items:center;font-style:normal}.hero h1{font-size:clamp(42px,5.8vw,72px);letter-spacing:-4px;line-height:.9}.grad{background:linear-gradient(90deg,#baff29,#76ff03,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}.composer{margin-top:28px;border:1px solid var(--line2);border-radius:12px;background:rgba(8,8,8,.7);text-align:left}.composer textarea{width:100%;height:108px;border:0;background:transparent;outline:0;color:#fff;padding:20px;font-size:17px;resize:none}.bar{height:56px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px}.model{height:32px;border:1px solid var(--acc-bd);background:var(--acc-bg);color:var(--acc);border-radius:999px;padding:0 14px;font:900 13px var(--mono);display:flex;gap:8px;align-items:center}.dot{width:8px;height:8px;background:var(--acc);border-radius:999px;box-shadow:0 0 14px var(--acc)}.send{width:36px;height:36px;border:1px solid var(--line2);background:transparent;border-radius:2px}.send.ready{background:var(--acc);border-color:var(--acc);color:#030a00}.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:24px}.studioChat,.studioBuild{height:100%;display:none}.studioChat.show{display:flex;justify-content:center}.threadShell{width:min(980px,94vw);height:100%;position:relative}.thread{height:100%;overflow:auto;padding:72px 0 170px}.msg{display:flex;flex-direction:column;max-width:720px;margin-bottom:24px}.msg.user{margin-left:auto;align-items:flex-end}.meta{font:900 11px var(--mono);letter-spacing:1px;color:var(--t3);margin-bottom:7px}.msg.user .meta{color:var(--acc)}.bubble{border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px 16px;line-height:1.55;white-space:pre-wrap}.msg.user .bubble{border-color:var(--acc-bd);box-shadow:inset 0 0 18px rgba(186,255,41,.08)}.bottom{position:absolute;left:0;right:0;bottom:0;padding:44px 0 18px;background:linear-gradient(to top,#080808 70%,transparent)}.studioBuild.show{display:block}.split{height:100%;display:flex}.leftPane{width:440px;min-width:280px;max-width:680px;border-right:1px solid var(--line);position:relative}.artifact{flex:1;min-width:0;display:flex;flex-direction:column}.tabs{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:22px;padding:0 18px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--t2);padding-bottom:13px}.tab.active{color:#fff;border-color:var(--acc)}.pane{flex:1;display:none;overflow:auto}.pane.active{display:block}.preview iframe{width:100%;height:100%;border:0;background:#080808}.code,.term{font:14px/1.65 var(--mono);padding:24px;white-space:pre-wrap}.term{color:#2edd5e}.wa{height:100%;display:grid;grid-template-columns:310px 1fr;border:1px solid var(--line)}.contacts{border-right:1px solid var(--line);overflow:auto}.contact{padding:12px;display:flex;gap:10px;border-left:2px solid transparent}.contact.active{border-left-color:#25d366;background:rgba(37,211,102,.08)}.chatArea{display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:18px}.waMsg{max-width:70%;border:1px solid var(--line2);border-radius:12px 12px 12px 2px;padding:10px 12px;margin-bottom:10px}.waMsg.me{margin-left:auto;border-color:rgba(37,211,102,.35);background:rgba(37,211,102,.1);border-radius:12px 12px 2px 12px}@media(max-width:900px){.brand{width:auto}.search,.right .icon,.side{display:none}.nav{gap:16px;padding:0 12px}.cols{grid-template-columns:1fr}.card{grid-column:auto!important}.wa{grid-template-columns:1fr}.contacts{display:none}.split{display:block}.leftPane{width:100%;height:48%;border-right:0;border-bottom:1px solid var(--line)}.artifact{height:52%}.bar .muted{display:none}.hero h1{letter-spacing:-2px}}
</style>

<body>
<div class="app">
<header class="top"><div class="brand"><button class="hamb" id="hamb">☰</button><div class="logo">C</div><div class="word">CHINNA</div><div class="ver">v7</div></div><nav class="nav" id="topnav"></nav><div class="right"><input class="search" id="search" placeholder="⌘K Search everything"><button class="icon" data-refresh>↻</button><button class="icon" data-go="settings">?</button></div></header>
<main class="main"><aside class="side" id="side"></aside><section class="content" id="content"><div class="view active" data-view="overview"><div class="vhead"><h2>damarakam mission control</h2><span class="sub">loading dashboard...</span></div><div class="vbody"><div class="card"><div class="k">BOOT</div><p>If this text is visible, the shell loaded. JavaScript will hydrate the dynamic UI.</p></div></div></div></section></main>
</div><div class="drawer" id="drawer"></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var NAV=[['overview','Overview','⌁'],['studio','Studio','◆'],['files','Files','▣'],['apps','Apps','▤'],['plugins','Plugins','✦'],['duplicates','Duplicates','◇'],['whatsapp','WhatsApp','●'],['secure','Secure','◉'],['webviews','Web Views','◎'],['mac','Mac','⌘'],['projects','Projects','⌂'],['connect','Connect','⇄'],['settings','Settings','⚙'],['changelog','Changelog','△']];
var state={view:(location.hash||'#overview').slice(1),model:'openrouter/free',history:[],artifact:null,chatId:''};
function $(s,r){return (r||document).querySelector(s)} function $all(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function api(u,o){return fetch(u,o||{}).then(function(r){return r.text().then(function(t){try{return JSON.parse(t)}catch(e){return {ok:r.ok,status:r.status,text:t}}})}).catch(function(e){return {error:e.message}})}
function post(u,b){return api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})})}
function fmt(n){n=Number(n||0);return n>1e9?(n/1e9).toFixed(1)+' GB':n>1e6?(n/1e6).toFixed(1)+' MB':n>1e3?(n/1e3).toFixed(1)+' KB':n+' B'}
function toast(m){var t=$('#toast');t.textContent=typeof m==='string'?m:JSON.stringify(m,null,2);t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(function(){t.classList.remove('show')},3500)}
function openDrawer(html){var d=$('#drawer');d.innerHTML=html;d.classList.add('show')}
function closeDrawer(){var d=$('#drawer');d.classList.remove('show')}
function boot(){var top=$('#topnav'),side=$('#side'),content=$('#content');top.innerHTML=NAV.slice(0,7).map(function(n){return '<button data-go="'+n[0]+'">'+n[1]+'</button>'}).join('');side.innerHTML=NAV.map(function(n){return '<button data-go="'+n[0]+'"><span>'+n[2]+'</span><span class="label">'+n[1]+'</span></button>'}).join('');content.innerHTML=NAV.map(function(n){return '<section class="view" data-view="'+n[0]+'"></section>'}).join('');document.body.addEventListener('click',onClick);$('#hamb').onclick=function(){side.classList.toggle('open')};$('#search').onkeydown=function(e){if(e.key==='Enter'){go('files');setTimeout(function(){searchFiles($('#search').value)},80)}};go(state.view||'overview')}
function onClick(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.refresh)render(state.view);if(b.dataset.close)closeDrawer();if(b.dataset.call)callAction(b.dataset.call,b.dataset.body)}
function callAction(ep,body){var payload={};try{payload=body?JSON.parse(body):{}}catch(e){};toast('Running '+ep);(ep.indexOf('GET ')==0?api(ep.slice(4)):post(ep,payload)).then(toast)}
function go(v){state.view=v||'overview';history.replaceState(null,'','#'+state.view);$all('.view').forEach(function(x){x.classList.toggle('active',x.dataset.view===state.view)});$all('[data-go]').forEach(function(x){x.classList.toggle('active',x.dataset.go===state.view)});render(state.view)}
function head(id,title,sub){return '<div class="vhead"><h2>'+title+'</h2><span class="sub">'+(sub||'')+'</span><span style="flex:1"></span><button class="btn" data-refresh="1">Refresh</button></div>'}
function current(){return $('.view[data-view="'+state.view+'"]')}
function render(v){var el=$('.view[data-view="'+v+'"]');if(!el)return;({overview:overview,studio:studio,files:files,apps:apps,plugins:plugins,duplicates:duplicates,whatsapp:whatsapp,secure:secure,webviews:webviews,mac:mac,projects:projects,connect:connect,settings:settings,changelog:changelog}[v]||overview)(el)}
function composer(ph){return '<div class="composer"><textarea placeholder="'+esc(ph)+'"></textarea><div class="bar"><button class="model"><span class="dot"></span><span>'+esc(state.model.indexOf('free')>=0?'chinna/free':'chinna/auto')+'</span></button><button class="btn" data-attach>+</button><span style="flex:1"></span><span class="muted mono">enter send</span><button class="send">↑</button></div></div>'}
function bindComposer(root){$all('.composer textarea',root).forEach(function(ta){ta.oninput=function(){var s=$('.send',ta.closest('.composer'));if(s)s.classList.toggle('ready',!!ta.value.trim())};ta.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();studioSend(ta.value);ta.value='';ta.dispatchEvent(new Event('input'))}}});$all('.send',root).forEach(function(b){b.onclick=function(){var ta=$('textarea',b.closest('.composer'));studioSend(ta.value);ta.value='';ta.dispatchEvent(new Event('input'))}});$all('[data-attach]',root).forEach(function(b){b.onclick=function(){openDrawer('<button class="btn" data-close="1">Close</button><h3>Attach / Import</h3><div class="grid" style="margin-top:14px"><input type="file" multiple class="field"><input class="field" id="repoUrl" placeholder="Git repo URL"><button class="btn primary" id="cloneBtn">Clone Git repo</button><input class="field" id="macSearch" placeholder="Search Mac files"><button class="btn" id="macSearchBtn">Search Files</button><pre class="term" id="drawerOut"></pre></div>');setTimeout(function(){var c=$('#cloneBtn'),s=$('#macSearchBtn');if(c)c.onclick=function(){post('/api/forge/github-clone',{repo:$('#repoUrl').value}).then(function(j){$('#drawerOut').textContent=JSON.stringify(j,null,2)})};if(s)s.onclick=function(){api('/api/fs/search?q='+encodeURIComponent($('#macSearch').value)+'&base=~').then(function(j){$('#drawerOut').textContent=JSON.stringify(j,null,2)})}},20)}})}
function overview(el){el.innerHTML=head('overview','damarakam mission control','live telemetry, shortcuts, AI readiness')+'<div class="vbody"><div class="grid cols"><section class="card" style="grid-column:span 8"><div class="k">CHINNA MISSION CONTROL</div><h1 style="font-size:28px">damarakam mission control</h1><p class="muted">All widgets are live. Buttons call Python routes and report status.</p><div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><span class="chip" id="net">checking</span><span class="chip mono" id="ip">ip</span><span class="chip mono" id="chip">chip</span><span class="chip mono" id="modelTag">model</span></div></section><section class="card" style="grid-column:span 4"><div class="k">MAC VITALS</div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="stat"><small>CPU</small><br><b class="green" id="cpu">--</b></div><div class="stat"><small>RAM</small><br><b class="blue" id="ram">--</b></div><div class="stat"><small>DISK</small><br><b class="red" id="disk">--</b></div><div class="stat"><small>BATTERY</small><br><b class="amber" id="bat">--</b></div></div></section><section class="card" style="grid-column:span 4"><div class="k">SHORTCUTS</div><div class="grid" style="grid-template-columns:repeat(3,1fr)"><button class="btn" data-go="studio">Studio</button><button class="btn" data-go="files">Files</button><button class="btn" data-go="apps">Apps</button><button class="btn" data-go="plugins">Plugins</button><button class="btn" data-go="duplicates">Duplicates</button><button class="btn" data-go="settings">Settings</button></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:10px"><button class="btn danger" data-call="/api/purge">Purge RAM</button><button class="btn" data-call="/api/clean">Deep Clean</button><button class="btn" data-call="GET /api/doctor">Doctor</button><button class="btn" data-call="GET /api/ports">Ports</button></div></section><section class="card" style="grid-column:span 4"><div class="k">AI READINESS</div><div id="aiStat" class="muted">checking...</div><button class="btn primary" data-go="studio" style="margin-top:12px">Open Studio</button><button class="btn" data-go="settings" style="margin-top:12px">Add Key / Model</button></section><section class="card" style="grid-column:span 4"><div class="k">OPEN WEATHER</div><div style="font-size:46px;font-weight:950">29°</div><b class="blue">Partly Cloudy</b><p class="muted">Hyderabad · fallback</p></section><section class="card" style="grid-column:span 6"><div class="k">QUICK AI</div>'+composer('Ask Chinna — chat, code, Mac control')+'</section><section class="card" style="grid-column:span 6"><div class="k">QUICK TERMINAL</div><pre class="term" id="overviewTerm">loading...</pre></section></div></div>';bindComposer(el);api('/api/stats').then(function(s){$('#cpu',el).textContent=((s.cpu&&s.cpu.pct)||0)+'%';$('#ram',el).textContent=((s.memory&&s.memory.pct)||0)+'%';$('#disk',el).textContent=((s.disk&&s.disk.pct)||0)+'%';$('#bat',el).textContent=((s.battery&&s.battery.pct)||0)+'%';$('#net',el).textContent=(s.network&&s.network.status)||'offline';$('#ip',el).textContent=(s.network&&s.network.ip)||'offline';$('#chip',el).textContent=((s.os&&s.os.chip)||'Mac').replace('Apple ','').slice(0,24);$('#overviewTerm',el).textContent=JSON.stringify(s,null,2).slice(0,1500)});api('/api/ai/status').then(function(a){$('#aiStat',el).textContent=a.label||a.ai_status||a.error||'status unavailable'});api('/api/models').then(function(m){$('#modelTag',el).textContent=m.active_display||m.active||state.model})}
function studio(el){el.innerHTML='<section class="hero studioHero"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="heroCore"><div class="studioMark"><i>C</i><span>CHINNA STUDIO</span></div><h1>What are we<br><span class="grad">building today?</span></h1><p class="muted" style="margin-top:16px">Chat · Code · Agent · Mac control — all in one.</p>'+composer('Ask anything, paste code, drop a file, or describe what to build...')+'<div class="chips">'+['Build a landing page','Fix TypeScript errors','Run Mac Doctor','Write a Python script','Explain this codebase','Clone a GitHub repo','Generate a UI component','Debug React app'].map(function(x){return '<button class="chip" data-prompt="'+esc(x)+'">'+esc(x)+'</button>'}).join('')+'</div></div></section><section class="studioChat"><div class="threadShell"><div class="thread chatThread"></div><div class="bottom"><button class="btn" data-go="studio">← New chat</button>'+composer('Ask Chinna — chat...')+'</div></div></section><section class="studioBuild"><div class="split"><aside class="leftPane"><div class="thread buildThread"></div><div class="bottom"><button class="btn" data-go="studio">← New chat</button>'+composer('Ask Chinna — build...')+'</div></aside><section class="artifact"><div class="tabs"><button class="tab active" data-tab="preview">Preview</button><button class="tab" data-tab="code">Code</button><button class="tab" data-tab="terminal">Terminal</button><span class="muted mono fileLabel" style="margin-left:auto">artifact.html</span><button class="btn primary" id="exportArtifact">Export</button></div><div class="pane preview active"><div class="card" style="height:100%;display:grid;place-items:center">Preview appears after a build.</div></div><pre class="pane code"></pre><pre class="pane term">$ chinna studio\nready</pre></section></div></section>';bindComposer(el);$all('[data-prompt]',el).forEach(function(b){b.onclick=function(){studioSend(b.dataset.prompt)}});$all('[data-tab]',el).forEach(function(b){b.onclick=function(){tab(el,b.dataset.tab)}});$('#exportArtifact',el).onclick=function(){post('/api/agent/export',{ids:state.artifact?[state.artifact.id]:[],zip:true,to_disk:true}).then(function(j){toast(j.message||j.error||'Export complete');if(j.zip_download)location.href=j.zip_download})}}

ction(){post('/api/model-set',{preset:b.dataset.preset}).then(function(j){state.model=j.active||state.model;toast(j)})}})});api('/api/ui-layout').then(function(j){$('#layoutJson',el).value=JSON.stringify(j.layout||{},null,2)});api('/api/custom-views').then(function(j){$('#viewsJson',el).value=JSON.stringify(j.views||[],null,2)});$('#saveKeys',el).onclick=function(){post('/api/save_keys',{chinna_ai_key:$('#orKey',el).value,openai_key:$('#oaKey',el).value,telegram_token:$('#tgToken',el).value,telegram_chat:$('#tgChat',el).value}).then(toast)};$('#setCustomModel',el).onclick=function(){post('/api/model-set',{custom:$('#customModel',el).value}).then(toast)};$('#checkUpdate',el).onclick=function(){api('/api/check-update').then(toast)};$('#clearChat',el).onclick=function(){post('/api/chat/clear',{}).then(toast)};$('#saveLayout',el).onclick=function(){post('/api/ui-layout',{layout:JSON.parse($('#layoutJson',el).value||'{}')}).then(toast)};$('#saveViews',el).onclick=function(){post('/api/custom-views',{views:JSON.parse($('#viewsJson',el).value||'[]')}).then(toast)}}
function changelog(el){el.innerHTML=head('changelog','Changelog','version log and upgrade history')+'<div class="vbody"><div class="grid" id="logGrid">loading...</div></div>';api('/api/version-log').then(function(d){$('#logGrid',el).innerHTML=(d.versions||[]).map(function(v){return '<div class="card"><div class="k">'+esc(v.version)+'</div><h3>'+esc(v.title||'Chinna update')+'</h3><p class="muted">'+esc([].concat(v.improved||[],v.resolved||[]).join(' · '))+'</p></div>'}).join('')+'<div class="card"><div class="k">HISTORY</div><pre class="term">'+esc(JSON.stringify(d.history||[],null,2))+'</pre></div>'})}
function watchJob(id){if(!id){toast('No job id returned');return}openDrawer('<button class="btn" data-close>Close</button><h3>Job '+esc(id)+'</h3><pre class="term" id="jobOut">starting...</pre>');var x=setInterval(function(){api('/api/job?id='+encodeURIComponent(id)).then(function(j){var out=$('#jobOut');if(out)out.textContent=(j.lines||[]).join('\n');if(j.done){clearInterval(x);toast(j.ok?'Job complete':'Job failed')}})},900)}
